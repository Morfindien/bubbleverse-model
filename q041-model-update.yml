name: "🧪 BUBBLEVERSE MODEL — Q041 UPDATE"

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type Q041 to authorize this exact model update"
        required: true
        default: "Q041"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: bubbleverse-model-q041-update
  cancel-in-progress: false

jobs:
  q041-model-update:
    if: ${{ github.event.inputs.confirm_target == 'Q041' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout bubbleverse-model
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "bubbleverse-model[bot]"
          git config user.email "bubbleverse-model@users.noreply.github.com"

      - name: Q041 source provenance preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_REPO="Morfindien/Bubbleverse"
          SOURCE_SHA="a962ba70077422f8b69642dea4e8272e1d00e5ff"

          git clone --filter=blob:none --no-checkout "https://github.com/${SOURCE_REPO}.git" /tmp/Bubbleverse
          git -C /tmp/Bubbleverse fetch --depth=1 origin "${SOURCE_SHA}"
          git -C /tmp/Bubbleverse checkout --detach "${SOURCE_SHA}"

          test "$(git -C /tmp/Bubbleverse rev-parse HEAD)" = "${SOURCE_SHA}"

          test "$(git -C /tmp/Bubbleverse hash-object q041_planck_portability_preregister_v19.json)" = "36bf90f3112a305db0adbf68b8a32339f16acf5c"
          test "$(git -C /tmp/Bubbleverse hash-object q041_planck_portability_source_lock_v19.json)" = "caabb6cbc573f00bb435e00af8ebf47f64481673"
          test "$(git -C /tmp/Bubbleverse hash-object q041_planck_portability_tests_v19.py)" = "f88240c5c1f3580d19d7cf213c3b12e354b00850"
          test "$(git -C /tmp/Bubbleverse hash-object q041_planck_portability_v19.py)" = "2190b0a63abfa563f57da20515b5058a4b7b209f"

          RUN_SHA="$(gh api repos/Morfindien/Bubbleverse/actions/runs/34979609004 --jq '.head_sha')"
          RUN_STATUS="$(gh api repos/Morfindien/Bubbleverse/actions/runs/34979609004 --jq '.status')"
          RUN_CONCLUSION="$(gh api repos/Morfindien/Bubbleverse/actions/runs/34979609004 --jq '.conclusion')"
          ARTIFACT_DIGEST="$(gh api repos/Morfindien/Bubbleverse/actions/artifacts/10754769330 --jq '.digest')"

          test "${RUN_SHA}" = "${SOURCE_SHA}"
          test "${RUN_STATUS}" = "completed"
          test "${RUN_CONCLUSION}" = "success"
          test "${ARTIFACT_DIGEST}" = "sha256:2284518ecbaaf1ff0d0093977827d5162ec29549ba2b81880f266c250311ca2b"

          echo "Q041_SOURCE_PROVENANCE_GATE=PASS"

      - name: Materialize Q041 updater
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/q041_model_updater.b64 <<'BUBBLEVERSE_Q041_INSTALLER'
