BUBBLEVERSE_Q041_INSTALLER

          base64 --decode /tmp/q041_model_updater.b64 > /tmp/install_q041_model_update.py
          python -m py_compile /tmp/install_q041_model_update.py

          EXPECTED="4f1c12d8c046668445388671055ffbe02de1f32352656c22d466982000867f2b"
          ACTUAL="$(sha256sum /tmp/install_q041_model_update.py | awk '{print $1}')"
          test "${ACTUAL}" = "${EXPECTED}"

          echo "Q041_UPDATER_INTEGRITY_GATE=PASS"

      - name: Execute Q041 candidate, gates and promotion
        id: updater
        shell: bash
        run: |
          set +e
          python /tmp/install_q041_model_update.py --push
          CODE=$?
          set -e

          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"

          if [ "${CODE}" -eq 0 ]; then
            echo "DIRECT_PUSH=PASS"
          elif [ "${CODE}" -eq 3 ]; then
            echo "DIRECT_PUSH=BLOCKED_WILL_FALLBACK_TO_BRANCH"
          else
            echo "MODEL_UPDATE_EXIT=${CODE}"
          fi

          exit 0

      - name: Preserve non-main result on fallback branch
        id: fallback
        if: ${{ steps.updater.outputs.exit_code != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          AHEAD="$(git rev-list --count origin/main..HEAD)"
          if [ "${AHEAD}" -eq 0 ]; then
            echo "branch_created=false" >> "$GITHUB_OUTPUT"
            echo "No local update commit exists to preserve."
            exit 0
          fi

          BRANCH="automation/q041-model-update-${GITHUB_RUN_ID}"
          git switch -c "${BRANCH}"
          git push origin "${BRANCH}"

          echo "branch_created=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          gh pr create             --base main             --head "${BRANCH}"             --title "Bubbleverse model update through Q041"             --body "Automated Q041 model-update transaction. Review the candidate/promotion records, gates, provenance and immutable accepted snapshot before merging."

      - name: Final workflow state
        shell: bash
        run: |
          CODE="${{ steps.updater.outputs.exit_code }}"

          if [ "${CODE}" = "0" ]; then
            echo "STOP_STATE=PROMOTED"
            exit 0
          fi

          if [ "${CODE}" = "3" ]; then
            echo "Main push was blocked, but the promoted transaction was preserved on a fallback branch/PR."
            echo "STOP_STATE=PROMOTED_PENDING_MERGE"
            exit 0
          fi

          echo "The update did not reach promotion. Any committed candidate state was preserved on a fallback branch."
          echo "STOP_STATE=CANDIDATE_BLOCKED_OR_TECHNICAL_BLOCK"
          exit 1
