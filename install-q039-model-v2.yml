      - name: Install model repository state through Q039
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/bubbleverse-q039.tar.gz -C "$GITHUB_WORKSPACE"
          test -f candidate/MODEL_CANDIDATE.md
          test -f tests/programs/model_campaign.py
          test -f .github/workflows/00-bubbleverse-model-start.yml
          test -f release/MODEL_RELEASE_HANDOFF.json
          echo "Q039 model files installed."

      - name: Local integrity validation before push
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/model_campaign.py validate

      - name: Remove one-time installer workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-q039-model.yml
          rm -f .github/workflows/install-q039-model-fixed.yml

      - name: Commit and push bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bubbleverse-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Bootstrap Bubbleverse model through Q039"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Installation complete
        shell: bash
        run: |
          echo "BUBBLEVERSE Q039 MODEL INSTALLATION COMPLETE"
          echo "Next: Actions -> 🧪 BUBBLEVERSE MODEL — START -> Run workflow -> test"
