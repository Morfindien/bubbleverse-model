name: "🏗️ BUBBLEVERSE MODEL — INSTALL Q039"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-install-q039
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify target repository
        shell: bash
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "Repository: $GITHUB_REPOSITORY"
          test "$repo" = "morfindien/bubbleverse-model" || {
            echo "ERROR: Installer is locked to Morfindien/bubbleverse-model"
            exit 1
          }

