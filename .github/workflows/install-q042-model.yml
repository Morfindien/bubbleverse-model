name: Install Q042 Model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-state-installation
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Morfindien/bubbleverse-model' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read model repository with complete Git provenance
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify supplied installer
        shell: bash
        run: |
          echo '4dc0dae3234b7f30ea7b055ff05cb83c969c9fc6d432cd6cbd8fe1a39f7315c2  install_q042_model.py' | sha256sum --check
      - name: Validate and install Q042 model
        shell: bash
        run: |
          python install_q042_model.py --repo .
      - name: Publish validated local model
        shell: bash
        run: |
          git push origin HEAD:refs/heads/main
      - name: Record observed publication
        shell: bash
        run: |
          python install_q042_model.py --repo . --record-publication
          git push origin HEAD:refs/heads/main
      - name: Verify final repository head
        shell: bash
        run: |
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$local_head" = "$remote_head"
          python tests/programs/q042_model_validate.py
          {
            echo '## Q042 model installation completed'
            echo 'Accepted model: v0.4 / R000004 through Q042.'
            echo 'Physical model unchanged. No production restart.'
            echo "Verified repository commit: $local_head"
          } >> "$GITHUB_STEP_SUMMARY"
