name: "BUBBLEVERSE — INSTALL Q044 MODEL"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Install reviewed Q044, or validate without publishing"
        type: choice
        required: true
        default: install
        options:
          - install
          - validate

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-refs/heads/main
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Morfindien/bubbleverse-model' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify, validate and install Q044
        env:
          INSTALL_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,subprocess,sys,textwrap,unittest

          BASE='dd7575e7146382957d206e87274ca6246c2587b7'
          PACKAGE='a71ce42fd41ee5b84537b8ee5acabf59004d8e2c'
          BUNDLE_SHA='aebdc6bc7de267154956d8ebf933bd11fc64e2408fedbbd75ee6dc711d9ce9a3'
          BUNDLE=Path('Q044_model_update.bundle')
          INSTALLER='.github/workflows/q044-install-model.yml'
          RECEIPT='provenance/Q044_REMOTE_INSTALLATION_RECEIPT.json'
          OUT=Path('run-output/q044-install');OUT.mkdir(parents=True,exist_ok=True)
          UPLOADS={INSTALLER,str(BUNDLE)}
          FINAL_METADATA={'candidate/candidate_state.json','release/MODEL_RELEASE_HANDOFF.json','release/MODEL_RELEASE_HANDOFF.md','README.md',RECEIPT}

          def run(*args,capture=False):
              p=subprocess.run(args,text=True,stdout=subprocess.PIPE if capture else None,check=True)
              return p.stdout.strip() if capture else None
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          def load(path):return json.loads(Path(path).read_text())
          def dump(path,value):
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          def remote_head():
              result=run('git','ls-remote','origin','refs/heads/main',capture=True).split()
              require(len(result)==2,'Cannot verify remote main');return result[0]
          def ancestor(a,b):return subprocess.run(['git','merge-base','--is-ancestor',a,b]).returncode==0
          def changed(a,b):return set(run('git','diff','--name-only',a,b,capture=True).splitlines())
          def protected_hashes():
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for name in ('accepted','candidate','model','evidence','release','versions','tests') for p in Path(name).rglob('*') if p.is_file() and '__pycache__' not in p.parts}
          def validate():
              before=protected_hashes()
              run(sys.executable,'tests/programs/model_campaign.py','validate')
              run(sys.executable,'tests/programs/q044_model_validate.py')
              suite=unittest.defaultTestLoader.discover('tests/programs',pattern='test_*.py')
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              require(result.wasSuccessful() and not result.skipped and result.testsRun==40,'Regression gate requires 40 passing tests with zero skips')
              source=Path('.github/workflows/00-bubbleverse-model-start-public.yml').read_text()
              code=textwrap.dedent(source.split("          python - <<'PY'\n",1)[1].split('\n          PY',1)[0])
              with (OUT/'public-healthcheck.log').open('w') as log:
                  subprocess.run([sys.executable,'-c',code],env={**os.environ,'BV_OPERATION':'test','BV_INPUT':''},stdout=log,stderr=subprocess.STDOUT,check=True)
              health=load('run-output/result.json')
              require(health['all_green'] and health['tests_passed']==health['tests_total']==20,'Public healthcheck failed')
              require(before==protected_hashes(),'Validation changed protected scientific files')
              require(subprocess.run(['git','diff','--quiet']).returncode==0,'Validation left unstaged tracked changes')
              state=load('accepted/model_state.json')
              require(state['current_q']==state['q_access_end']=='Q044' and state['accepted_model_version']=='v0.6' and state['model_revision']=='R000006' and state['production_restart_authorized'] is False and state['physical_model_change'] is False,'Accepted qualification differs')
              return {'regression_tests_passed':40,'public_healthcheck_passed':20,'campaign_gate':'PASS','q044_gate':'PASS','protected_state_unchanged':True}
          def stage_acceptance_metadata():
              c=load('candidate/candidate_state.json');c.update(promotion_status='PROMOTED_TO_ACCEPTED',status='PROMOTED_LOCAL_PENDING_REMOTE_VERIFICATION');dump('candidate/candidate_state.json',c)
              r=load('release/MODEL_RELEASE_HANDOFF.json');r.update(candidate_promoted=True,projection_only=False,candidate_promotion_gate='PASS',all_mandatory_green=True,release_status='LOCAL_ACCEPTANCE_PASSED_REMOTE_VERIFICATION_PENDING',promoted_at=datetime.now(timezone.utc).isoformat());dump('release/MODEL_RELEASE_HANDOFF.json',r)
              run('git','add','candidate/candidate_state.json','release/MODEL_RELEASE_HANDOFF.json')
          def write_receipt(report):
              dump(RECEIPT,report)
              c=load('candidate/candidate_state.json');c.update(status='PROMOTED_REMOTE_VERIFIED');dump('candidate/candidate_state.json',c)
              r=load('release/MODEL_RELEASE_HANDOFF.json');r.update(remote_promotion_verified=True,remote_accepted_model='v0.6',remote_accepted_q='Q044',repository_write_gate='PASS',release_status='PROMOTED_REMOTE_VERIFIED',stop_state='PROMOTED',model_repository_commit=report['promotion_commit'],model_repository_commit_semantics='Verified remote promotion commit; receipt recorded in subsequent commit');dump('release/MODEL_RELEASE_HANDOFF.json',r)
              p=Path('README.md');s=p.read_text().replace('Prepared installation state: **v0.6 / R000006 through Q044**','Accepted state: **v0.6 / R000006 through Q044**').replace('Last verified remote accepted state: **v0.5 / R000005 through Q043**','Verified remote accepted state: **v0.6 / R000006 through Q044**').replace('Remote publication: **BLOCKED** by integration permission (HTTP 403) and missing Git credentials.','Remote publication: **VERIFIED**; see `provenance/Q044_REMOTE_INSTALLATION_RECEIPT.json`. Preparation-time blocked reports are preserved historically.');p.write_text(s)
              p=Path('release/MODEL_RELEASE_HANDOFF.md');line='\nVerified remote Q044 promotion: v0.6/R000006. Current publication identity is in provenance/Q044_REMOTE_INSTALLATION_RECEIPT.json. Preparation-time blocked reports remain historical; scientific restrictions remain active.\n'
              if line not in p.read_text():p.write_text(p.read_text()+line)
              run('git','add',RECEIPT,'candidate/candidate_state.json','release/MODEL_RELEASE_HANDOFF.json','release/MODEL_RELEASE_HANDOFF.md','README.md')
          def main():
              require(os.environ.get('GITHUB_REPOSITORY')=='Morfindien/bubbleverse-model','Only Morfindien/bubbleverse-model is authorized')
              require(os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch' and os.environ.get('GITHUB_REF')=='refs/heads/main','Run manually on main')
              mode=os.environ.get('INSTALL_MODE','install');require(mode in ('install','validate'),'Unsupported mode')
              require(run('git','branch','--show-current',capture=True)=='main','Checkout must be main')
              require(not run('git','status','--porcelain',capture=True),'Checkout is not clean')
              require(BUNDLE.is_file(),'Upload Q044_model_update.bundle to the repository root')
              require(hashlib.sha256(BUNDLE.read_bytes()).hexdigest()==BUNDLE_SHA,'Bundle SHA256 mismatch')
              run('git','bundle','verify',str(BUNDLE));run('git','fetch',str(BUNDLE),'refs/heads/install-q044:refs/remotes/q044-package/model')
              require(run('git','rev-parse','refs/remotes/q044-package/model',capture=True)==PACKAGE,'Unexpected package commit')
              initial=run('git','rev-parse','HEAD',capture=True);require(initial==remote_head(),'main moved since checkout; rerun')
              require(ancestor(BASE,initial),'Required baseline is not an ancestor')
              run('git','config','user.name','github-actions[bot]');run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              already_current=ancestor(PACKAGE,initial)
              if already_current:
                  require(changed(PACKAGE,initial)<=UPLOADS|FINAL_METADATA,'Installed model differs from the reviewed package; re-audit required')
              else:
                  require(changed(BASE,initial)<=UPLOADS,'Model baseline changed; only the YAML and bundle uploads are permitted')
                  run('git','merge','--no-ff','--no-commit',PACKAGE)
                  require(not run('git','diff','--name-only','--diff-filter=U',capture=True),'Merge conflict')
                  require(changed(PACKAGE,'HEAD')<=UPLOADS|set(run('git','diff','--cached','--name-only',capture=True).splitlines()),'Unexpected merge input')
                  require(set(run('git','diff','--name-only',PACKAGE,capture=True).splitlines())<=UPLOADS,'Merged tree differs from the reviewed package')
              completed=False
              if already_current and Path(RECEIPT).exists():
                  receipt=load(RECEIPT);r=load('release/MODEL_RELEASE_HANDOFF.json')
                  recorded=receipt.get('promotion_commit','')
                  completed=receipt.get('remote_promotion_verified') is True and receipt.get('target_q')=='Q044' and receipt.get('accepted_version')=='v0.6' and r.get('remote_promotion_verified') is True and bool(recorded) and ancestor(PACKAGE,recorded) and ancestor(recorded,initial)
              if mode=='install' and not completed:stage_acceptance_metadata()
              checks=validate()
              report={'target_q':'Q044','accepted_version':'v0.6','model_revision':'R000006','package_commit':PACKAGE,'baseline_commit':BASE,'initial_main_commit':initial,'bundle_sha256':BUNDLE_SHA,'test_results':checks,'production_restart_authorized':False,'physical_model_change':False,'source_repository_modified':False,'next_q_authorized':False,'run_id':os.environ.get('GITHUB_RUN_ID'),'run_url':f"https://github.com/Morfindien/bubbleverse-model/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",'timestamp_utc':datetime.now(timezone.utc).isoformat()}
              if mode=='validate':report.update(stop_state='VALIDATED_NOT_PUBLISHED',remote_promotion_verified=False)
              elif completed:
                  require(remote_head()==initial,'main moved during validation');report.update(stop_state='ALREADY_CURRENT',remote_promotion_verified=True,verified_remote_commit=initial)
              else:
                  require(remote_head()==initial,'main moved during validation; no push attempted')
                  if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:run('git','commit','-m','Install validated Q044 model v0.6 preserving reviewed history and upload files')
                  promotion=run('git','rev-parse','HEAD',capture=True);require(ancestor(initial,promotion),'Publication must be a fast-forward')
                  run('git','push','origin','HEAD:refs/heads/main');require(remote_head()==promotion,'Remote promotion identity not verified')
                  report.update(stop_state='PROMOTED',remote_promotion_verified=True,promotion_commit=promotion)
                  write_receipt(report)
                  # Read-only current-state healthcheck also covers the final publication metadata.
                  checks=validate();report['test_results']=checks
                  run('git','commit','-m','Record verified remote Q044 installation receipt');run('git','push','origin','HEAD:refs/heads/main')
                  final=run('git','rev-parse','HEAD',capture=True);require(remote_head()==final,'Remote receipt identity not verified');report['verified_remote_commit']=final
              dump(OUT/'installation-result.json',report)
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:f.write(f"\nQ044 installer: **{report['stop_state']}**. 40/40 regressions; 20/20 public healthcheck.\nNo physical model change. Production and a new scientific question remain unauthorized.\n")
              print(json.dumps(report,indent=2))

          try:main()
          except Exception as exc:
              dump(OUT/'installation-error.json',{'stop_state':'INSTALLATION_BLOCKED','error':str(exc),'note':'Inspect remote main: promotion may have succeeded before a later receipt or verification failure. Rerun install to resume receipt finalization.'})
              raise
          PY
      - name: Preserve installation result and healthcheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q044-model-installation-${{ github.run_id }}
          path: run-output/
          if-no-files-found: warn
