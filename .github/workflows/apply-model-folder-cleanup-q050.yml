name: Apply model folder cleanup Q050
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview checks the exact batch; install validates and publishes only non-workflow maintenance changes"
        required: true
        type: choice
        default: preview
        options: [preview, install]
permissions:
  contents: write
concurrency:
  group: bubbleverse-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Morfindien/bubbleverse-model' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify exact installer before execution
        shell: bash
        run: |
          test -f tools/maintenance/apply_model_cleanup_q050.py || { echo "Upload apply_model_cleanup_q050.py to tools/maintenance/ first." >&2; exit 1; }
          test ! -L tools/maintenance/apply_model_cleanup_q050.py
          printf '%s  %s\n' '665ee04d88444d8d8c995ad478e07f44ffc70476345c6061b5063e188af97213' 'tools/maintenance/apply_model_cleanup_q050.py' | sha256sum --check --strict
      - name: Apply exact reviewed non-scientific cleanup batch
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python -I tools/maintenance/apply_model_cleanup_q050.py --mode "$CLEANUP_MODE" --branch "$CLEANUP_BRANCH"
      - name: Preserve exact preview/publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-cleanup-q050-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bubbleverse-folder-cleanup-result.json
          if-no-files-found: warn
          retention-days: 30
