name: "🧪 BUBBLEVERSE MODEL — START"

on:
  workflow_dispatch:
    inputs:
      input:
        description: "Input (JSON or numbers; leave blank for test/status/campaign)"
        required: false
        default: ""
        type: string
      operation:
        description: "Choose what Bubbleverse Model should do"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - gaussian-tension
          - difference
          - percent-shift
          - weighted-mean
          - known-results
          - contextualize-result
          - astronomy-catalog-context
          - validate-model
          - model-status
          - contradictions
          - provenance
          - release-handoff
          - campaign
          - install-context-engine

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bubbleverse Model operation
        id: bubbleverse
        shell: bash
        env:
          BV_INPUT: ${{ inputs.input }}
          BV_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mkdir -p run-output

          python - <<'PY'
          from __future__ import annotations
          import csv
          import io
          import json
          import math
          import hashlib
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / "run-output"
          OUT.mkdir(exist_ok=True)
          USER_INPUT = os.environ.get("BV_INPUT", "").strip()
          OP = os.environ.get("BV_OPERATION", "test").strip().lower()

          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def write_json(path: Path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def write_result(obj):
              write_json(OUT / "result.json", obj)

          def add_summary(lines):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")

          def parse_numbers(text: str):
              if not text:
                  return []
              parts = [x.strip() for x in text.split(",") if x.strip()]
              return [float(x) for x in parts]

          def parse_object_or_numbers(text: str):
              if not text:
                  return None, []
              try:
                  obj = json.loads(text)
                  if isinstance(obj, dict):
                      return obj, []
              except json.JSONDecodeError:
                  pass
              return None, parse_numbers(text)

          def parse_json_object(text: str):
              if not text:
                  return {}
              try:
                  obj = json.loads(text)
              except json.JSONDecodeError as exc:
                  raise ValueError("This operation requires JSON input.") from exc
              if not isinstance(obj, dict):
                  raise ValueError("Input must be a JSON object.")
              return obj

          def difference(text: str):
              obj, nums = parse_object_or_numbers(text)
              if obj is not None:
                  a = float(obj["a"])
                  b = float(obj["b"])
              else:
                  if len(nums) != 2:
                      raise ValueError('difference input: a,b OR {"a":...,"b":...}')
                  a, b = nums
              return {"operation": "difference", "a": a, "b": b, "delta": a - b, "absolute_delta": abs(a-b)}

          def gaussian_tension(text: str):
              obj, nums = parse_object_or_numbers(text)
              if obj is not None:
                  a = float(obj["a"])
                  sa = float(obj["sigma_a"])
                  b = float(obj["b"])
                  sb = float(obj["sigma_b"])
              else:
                  if len(nums) != 4:
                      raise ValueError("gaussian-tension input: a,sigma_a,b,sigma_b OR JSON object")
                  a, sa, b, sb = nums
              if sa <= 0 or sb <= 0:
                  raise ValueError("Uncertainties must be > 0")
              delta = a - b
              combined = math.sqrt(sa*sa + sb*sb)
              return {
                  "operation": "gaussian-tension",
                  "a": a, "sigma_a": sa, "b": b, "sigma_b": sb,
                  "delta": delta,
                  "absolute_delta": abs(delta),
                  "combined_sigma": combined,
                  "tension_sigma": abs(delta) / combined,
                  "note": "Simple independent-Gaussian marginal comparison; not by itself a detection of new physics."
              }

          def percent_shift(text: str):
              obj, nums = parse_object_or_numbers(text)
              if obj is not None:
                  old = float(obj.get("from", obj.get("old")))
                  new = float(obj.get("to", obj.get("new")))
              else:
                  if len(nums) != 2:
                      raise ValueError('percent-shift input: from,to OR {"from":...,"to":...}')
                  old, new = nums
              if old == 0:
                  raise ValueError("Reference value cannot be zero")
              change = new - old
              pct = 100.0 * change / old
              return {
                  "operation": "percent-shift",
                  "from": old, "to": new,
                  "change": change,
                  "percent_change": pct,
                  "absolute_percent_shift": abs(pct),
              }

          def weighted_mean(text: str):
              obj, nums = parse_object_or_numbers(text)
              if obj is not None:
                  values = [float(x) for x in obj["values"]]
                  sigmas = [float(x) for x in obj["sigmas"]]
              else:
                  if len(nums) < 4 or len(nums) % 2:
                      raise ValueError("weighted-mean input: value1,sigma1,value2,sigma2,... OR JSON values/sigmas")
                  values = nums[0::2]
                  sigmas = nums[1::2]
              if len(values) != len(sigmas) or not values:
                  raise ValueError("values and sigmas must have equal non-zero length")
              if any(s <= 0 for s in sigmas):
                  raise ValueError("All uncertainties must be > 0")
              weights = [1.0/(s*s) for s in sigmas]
              sw = sum(weights)
              mean = sum(v*w for v, w in zip(values, weights)) / sw
              sigma = math.sqrt(1.0/sw)
              return {
                  "operation": "weighted-mean",
                  "values": values,
                  "sigmas": sigmas,
                  "weighted_mean": mean,
                  "weighted_sigma": sigma,
                  "note": "Inverse-variance weighted mean; assumes the supplied measurements are suitable for this combination."
              }

          def q_number(value):
              if value is None:
                  return None
              m = re.fullmatch(r"Q-?0*([0-9]{1,5})", str(value), flags=re.I)
              return int(m.group(1)) if m else None

          def normalize_symbol(value):
              return re.sub(r"\s+", "", str(value or "")).casefold()

          def normalize_units(value):
              return re.sub(r"\s+", " ", str(value or "").strip()).casefold()

          def load_result_registry():
              p = ROOT / "model/result_registry.json"
              if not p.exists():
                  raise FileNotFoundError(
                      "Result context layer is not installed. Run operation 'install-context-engine' once."
                  )
              registry = read_json(p)
              accepted = read_json(ROOT / "accepted/model_state.json")
              for key in ("q_access_start", "q_access_end"):
                  if registry.get(key) != accepted.get(key):
                      raise RuntimeError(
                          f"Result registry {key}={registry.get(key)!r} does not match accepted state {accepted.get(key)!r}"
                      )
              end = q_number(accepted.get("q_access_end"))
              raw = p.read_text(encoding="utf-8")
              high = [
                  int(x)
                  for x in re.findall(r"\bQ-?0*([0-9]{1,5})\b", raw, flags=re.I)
                  if end is not None and int(x) > end
              ]
              if high:
                  raise RuntimeError(f"Future-Q contamination in result registry: {sorted(set(high))}")
              return registry, accepted

          def registered_results():
              registry, accepted = load_result_registry()
              results = []
              for src in registry.get("sources", []):
                  path = ROOT / src["path"]
                  if not path.exists():
                      raise FileNotFoundError(f"Registered result source missing: {src['path']}")
                  data = read_json(path)
                  allowed = set(src.get("allowed_statuses", []))
                  for item in data.get(src["list_key"], []):
                      status = item.get(src.get("status_field", "status"))
                      if allowed and status not in allowed:
                          continue
                      result = {
                          "registry_id": src["registry_id"],
                          "result_id": item[src["id_field"]],
                          "quantity": item[src["quantity_field"]],
                          "value": float(item[src["value_field"]]),
                          "sigma": float(item[src["sigma_field"]]) if item.get(src["sigma_field"]) is not None else None,
                          "units": item[src["units_field"]],
                          "status": status,
                          "source_path": src["path"],
                          "q_access_end": accepted["q_access_end"],
                      }
                      for field in src.get("copy_fields", []):
                          if field in item:
                              result[field] = item[field]
                      results.append(result)
              return registry, accepted, results

          def known_results(text: str):
              payload = parse_json_object(text)
              _, accepted, results = registered_results()
              quantity = payload.get("quantity")
              units = payload.get("units")
              if quantity is not None:
                  results = [r for r in results if normalize_symbol(r["quantity"]) == normalize_symbol(quantity)]
              if units is not None:
                  results = [r for r in results if normalize_units(r["units"]) == normalize_units(units)]
              return {
                  "operation": "known-results",
                  "status": "PASS",
                  "query": {"quantity": quantity, "units": units},
                  "registry_status": "MATCHED" if results else "NO_REGISTERED_RESULTS",
                  "registered_results": results,
                  "results_count": len(results),
                  "q_access_start": accepted["q_access_start"],
                  "q_access_end": accepted["q_access_end"],
                  "note": (
                      "These are registered Bubbleverse reference results inside the authorized Q boundary. "
                      "They are not a universal catalogue of all published results."
                  ),
              }

          def next_step(step_id, action, executor, reason):
              return {"step_id": step_id, "action": action, "executor": executor, "reason": reason}

          def external_lookup_route(reason):
              return [
                  next_step(
                      "NEXT-001",
                      "Verify the quantity name, units, input provenance and measurement/calculation method.",
                      "HUMAN_INPUT_VERIFICATION_REQUIRED",
                      reason,
                  ),
                  next_step(
                      "NEXT-002",
                      "Search authoritative literature or trusted external data sources for comparable results.",
                      "RESEARCH_AGENT_OR_HUMAN_REQUIRED",
                      "Bubbleverse has no comparable registered result inside the current Q boundary.",
                  ),
                  next_step(
                      "NEXT-003",
                      "If external evidence is relevant, ingest it through the normal Bubbleverse evidence/Q gate before treating it as model knowledge.",
                      "MODEL_UPDATE_PIPELINE_REQUIRED",
                      "External lookup must not silently expand accepted scientific state.",
                  ),
              ]

          def contextualize_result(text: str):
              payload = parse_json_object(text)
              if "quantity" not in payload or "value" not in payload:
                  raise ValueError('contextualize-result requires JSON with at least "quantity" and "value"')

              quantity = str(payload["quantity"])
              value = float(payload["value"])
              sigma = payload.get("sigma")
              sigma = None if sigma is None else float(sigma)
              units = payload.get("units")
              provenance = payload.get("provenance")
              if sigma is not None and sigma <= 0:
                  raise ValueError("sigma must be > 0 when supplied")

              _, accepted, all_results = registered_results()
              quantity_matches = [
                  r for r in all_results
                  if normalize_symbol(r["quantity"]) == normalize_symbol(quantity)
              ]

              base_input = {
                  "quantity": quantity,
                  "value": value,
                  "sigma": sigma,
                  "units": units,
                  "provenance": provenance,
              }

              if not quantity_matches:
                  return {
                      "operation": "contextualize-result",
                      "status": "PASS",
                      "input_result": base_input,
                      "registry_match_status": "UNREGISTERED_QUANTITY",
                      "span_status": "UNKNOWN",
                      "comparison_status": "NO_COMPARABLE_REGISTERED_RESULT",
                      "follow_up_recommended": True,
                      "follow_up_priority": "UNKNOWN",
                      "next_steps": external_lookup_route("The quantity is not present in the current Bubbleverse result registry."),
                      "new_physics_claim": "NOT_INFERRED",
                      "q_access_end": accepted["q_access_end"],
                      "note": "Absence from the registry means unknown to this model boundary, not unknown to science.",
                  }

              if units is None:
                  return {
                      "operation": "contextualize-result",
                      "status": "PASS",
                      "input_result": base_input,
                      "registry_match_status": "UNITS_REQUIRED",
                      "available_registered_units": sorted({r["units"] for r in quantity_matches}),
                      "span_status": "UNKNOWN",
                      "comparison_status": "NOT_EVALUATED",
                      "follow_up_recommended": True,
                      "follow_up_priority": "UNKNOWN",
                      "next_steps": external_lookup_route("Units are required before scientific comparison."),
                      "new_physics_claim": "NOT_INFERRED",
                      "q_access_end": accepted["q_access_end"],
                  }

              comparable = [
                  r for r in quantity_matches
                  if normalize_units(r["units"]) == normalize_units(units)
              ]
              if not comparable:
                  return {
                      "operation": "contextualize-result",
                      "status": "PASS",
                      "input_result": base_input,
                      "registry_match_status": "UNIT_MISMATCH_OR_UNREGISTERED_UNIT",
                      "available_registered_units": sorted({r["units"] for r in quantity_matches}),
                      "span_status": "UNKNOWN",
                      "comparison_status": "NOT_EVALUATED",
                      "follow_up_recommended": True,
                      "follow_up_priority": "UNKNOWN",
                      "next_steps": external_lookup_route("The quantity exists, but no registered result uses the supplied units."),
                      "new_physics_claim": "NOT_INFERRED",
                      "q_access_end": accepted["q_access_end"],
                  }

              comparisons = []
              for ref in comparable:
                  dist = None
                  if sigma is not None and ref["sigma"] is not None and sigma > 0 and ref["sigma"] > 0:
                      dist = abs(value - ref["value"]) / math.sqrt(sigma*sigma + ref["sigma"]*ref["sigma"])
                  comparisons.append({
                      "result_id": ref["result_id"],
                      "reference_value": ref["value"],
                      "reference_sigma": ref["sigma"],
                      "units": ref["units"],
                      "absolute_delta": abs(value - ref["value"]),
                      "gaussian_distance_sigma": dist,
                      "route": ref.get("route"),
                      "inference_chain": ref.get("inference_chain"),
                      "source_observation_id": ref.get("source_observation_id"),
                  })

              def nearest_key(item):
                  if item["gaussian_distance_sigma"] is not None:
                      return (0, item["gaussian_distance_sigma"])
                  return (1, item["absolute_delta"])

              nearest = min(comparisons, key=nearest_key)
              min_value = min(r["value"] for r in comparable)
              max_value = max(r["value"] for r in comparable)
              inside = min_value <= value <= max_value
              span_status = "WITHIN_REGISTERED_REFERENCE_SPAN" if inside else "OUTSIDE_REGISTERED_REFERENCE_SPAN"

              nd = nearest["gaussian_distance_sigma"]
              if nd is None:
                  comparison_status = "UNCERTAINTY_NOT_AVAILABLE_FOR_GAUSSIAN_DISTANCE"
                  priority = "MODERATE" if not inside else "LOW"
              elif nd >= 5:
                  comparison_status = "STRONGLY_DISAGREES_WITH_NEAREST_REGISTERED_RESULT"
                  priority = "HIGH"
              elif nd >= 3:
                  comparison_status = "ELEVATED_DISAGREEMENT_WITH_NEAREST_REGISTERED_RESULT"
                  priority = "ELEVATED"
              elif nd >= 2:
                  comparison_status = "MODERATE_DISAGREEMENT_WITH_NEAREST_REGISTERED_RESULT"
                  priority = "MODERATE"
              else:
                  comparison_status = "CONSISTENT_WITH_NEAREST_REGISTERED_RESULT_AT_LT_2_SIGMA"
                  priority = "LOW"

              follow_up = (not inside) or priority in {"HIGH", "ELEVATED"}
              if follow_up:
                  steps = [
                      next_step(
                          "NEXT-001",
                          "Verify input meaning, units, uncertainty, source and method.",
                          "HUMAN_INPUT_VERIFICATION_REQUIRED",
                          "Unexpected context can be caused by incorrect or incomparable inputs.",
                      ),
                      next_step(
                          "NEXT-002",
                          "Recompute the comparison against all registered comparable results.",
                          "MODEL_CAN_EXECUTE",
                          "The model can independently repeat the numerical context check using its registry.",
                      ),
                      next_step(
                          "NEXT-003",
                          "Design a reproduction/falsification checklist including independent route, numerical reproduction and systematic-error checks.",
                          "MODEL_CAN_DESIGN_TEST",
                          "A persistent outlying result should be attacked before receiving a physical interpretation.",
                      ),
                      next_step(
                          "NEXT-004",
                          "Check authoritative external literature/data for comparable results not yet present in the Bubbleverse registry.",
                          "RESEARCH_AGENT_OR_HUMAN_REQUIRED",
                          "The internal registry is Q-bounded and intentionally incomplete.",
                      ),
                      next_step(
                          "NEXT-005",
                          "If confirmation requires a new observation, measurement, laboratory test or instrument run, obtain new external data.",
                          "HUMAN_OR_EXTERNAL_EXPERIMENT_REQUIRED",
                          "The model cannot manufacture independent empirical evidence.",
                      ),
                  ]
              else:
                  steps = [
                      next_step(
                          "NEXT-001",
                          "No anomaly escalation is required from registry context alone; retain provenance and continue normal model use.",
                          "MODEL_CAN_EXECUTE",
                          "The supplied result is not strongly outlying relative to the nearest registered reference.",
                      )
                  ]

              return {
                  "operation": "contextualize-result",
                  "status": "PASS",
                  "input_result": base_input,
                  "registry_match_status": "MATCHED",
                  "registered_reference_count": len(comparable),
                  "registered_reference_span": {"minimum": min_value, "maximum": max_value, "units": units},
                  "span_status": span_status,
                  "comparison_status": comparison_status,
                  "nearest_registered_result": nearest,
                  "comparisons": comparisons,
                  "follow_up_recommended": follow_up,
                  "follow_up_priority": priority,
                  "next_steps": steps,
                  "new_physics_claim": "NOT_INFERRED",
                  "q_access_start": accepted["q_access_start"],
                  "q_access_end": accepted["q_access_end"],
                  "caution": (
                      "The registered reference span is not a physical allowed range and is not a complete survey of science. "
                      "Being outside it is a follow-up trigger, not evidence of new physics."
                  ),
              }


          def safe_float(value):
              if value is None:
                  return None
              raw = str(value).strip()
              if raw == "" or raw.lower() in {"null", "nan", "none"}:
                  return None
              try:
                  return float(raw)
              except ValueError:
                  return None

          def adql_escape_string(value):
              return str(value).replace("'", "''")

          def angular_separation_arcsec(ra1_deg, dec1_deg, ra2_deg, dec2_deg):
              ra1 = math.radians(float(ra1_deg))
              dec1 = math.radians(float(dec1_deg))
              ra2 = math.radians(float(ra2_deg))
              dec2 = math.radians(float(dec2_deg))
              cosang = (
                  math.sin(dec1) * math.sin(dec2)
                  + math.cos(dec1) * math.cos(dec2) * math.cos(ra1 - ra2)
              )
              cosang = max(-1.0, min(1.0, cosang))
              return math.degrees(math.acos(cosang)) * 3600.0

          def tap_query_csv(endpoint, query, timeout_seconds=30):
              payload = urllib.parse.urlencode({
                  "REQUEST": "doQuery",
                  "LANG": "ADQL",
                  "FORMAT": "csv",
                  "QUERY": query,
              }).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded",
                      "User-Agent": "Bubbleverse-Model/astronomy-catalog-context",
                      "Accept": "text/csv,text/plain,*/*",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout_seconds) as response:
                      raw = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:1000]
                  raise RuntimeError(f"TAP HTTP {exc.code}: {detail}") from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f"TAP network error: {exc.reason}") from exc

              stripped = raw.lstrip()
              if stripped.startswith("<"):
                  raise RuntimeError("TAP service returned XML/HTML instead of requested CSV")
              reader = csv.DictReader(io.StringIO(raw))
              if not reader.fieldnames:
                  raise RuntimeError("TAP service returned no CSV header")
              return [dict(row) for row in reader]

          def load_external_catalog_registry():
              path = ROOT / "model/external_catalog_registry.json"
              if not path.exists():
                  raise FileNotFoundError(
                      "External astronomy catalog layer is not installed. "
                      "Run operation 'install-context-engine' once."
                  )
              registry = read_json(path)
              accepted = read_json(ROOT / "accepted/model_state.json")
              if registry.get("q_access_start") != accepted.get("q_access_start"):
                  raise RuntimeError("External catalog registry q_access_start mismatch")
              if registry.get("q_access_end") != accepted.get("q_access_end"):
                  raise RuntimeError("External catalog registry q_access_end mismatch")
              return registry, accepted

          def astronomy_catalog_config_self_test():
              registry, accepted = load_external_catalog_registry()
              required = {"SIMBAD", "GAIA_DR3", "VIZIER_2MASS"}
              services = registry.get("services", {})
              checks = {
                  "required_services": required <= set(services),
                  "boundary_match": (
                      registry.get("q_access_start") == accepted.get("q_access_start")
                      and registry.get("q_access_end") == accepted.get("q_access_end")
                  ),
                  "https_only": all(
                      str(services[s].get("endpoint", "")).startswith("https://")
                      for s in required
                      if s in services
                  ),
                  "external_only": registry.get("model_admission_policy") == "EXTERNAL_REFERENCE_ONLY",
                  "no_auto_promotion": registry.get("automatic_model_admission") is False,
              }
              if not all(checks.values()):
                  raise AssertionError(checks)
              return checks

          def _catalog_result(service, status, **kwargs):
              result = {
                  "service": service,
                  "status": status,
                  "admission_status": "EXTERNAL_REFERENCE_ONLY",
              }
              result.update(kwargs)
              return result

          def astronomy_catalog_context(text):
              payload = parse_json_object(text)
              object_name = payload.get("object")
              ra_supplied = payload.get("ra_deg")
              dec_supplied = payload.get("dec_deg")

              if not object_name and (ra_supplied is None or dec_supplied is None):
                  raise ValueError(
                      'astronomy-catalog-context requires either {"object":"Vega"} '
                      'or {"ra_deg":...,"dec_deg":...}'
                  )

              radius_arcsec = float(payload.get("radius_arcsec", 5.0))
              if not (0.1 <= radius_arcsec <= 300.0):
                  raise ValueError("radius_arcsec must be between 0.1 and 300")
              radius_deg = radius_arcsec / 3600.0
              max_rows = int(payload.get("max_rows", 5))
              max_rows = max(1, min(max_rows, 20))

              registry, accepted = load_external_catalog_registry()
              services = registry["services"]
              accessed_at = datetime.now(timezone.utc).isoformat()

              requested_services = payload.get("services", ["SIMBAD", "GAIA_DR3", "VIZIER_2MASS"])
              if not isinstance(requested_services, list):
                  raise ValueError("services must be a JSON list")
              requested_services = [str(x).upper() for x in requested_services]
              unknown_services = sorted(set(requested_services) - set(services))
              if unknown_services:
                  raise ValueError(f"Unknown astronomy catalog services: {unknown_services}")

              results = {}
              target_ra = safe_float(ra_supplied)
              target_dec = safe_float(dec_supplied)
              target_origin = "USER_COORDINATES" if target_ra is not None and target_dec is not None else None

              # SIMBAD resolves object names and also serves as an independent positional catalogue.
              if "SIMBAD" in requested_services or object_name:
                  simbad_cfg = services["SIMBAD"]
                  try:
                      if object_name:
                          ident = adql_escape_string(object_name)
                          query = (
                              f"SELECT TOP {max_rows} basic.main_id, basic.otype, basic.ra, basic.dec, "
                              "basic.plx_value, basic.rvz_radvel, basic.nbref "
                              "FROM basic JOIN ident ON basic.oid = ident.oidref "
                              f"WHERE ident.id = '{ident}'"
                          )
                      else:
                          query = (
                              f"SELECT TOP {max_rows} main_id, otype, ra, dec, plx_value, rvz_radvel, nbref "
                              "FROM basic "
                              "WHERE 1=CONTAINS("
                              "POINT('ICRS',ra,dec),"
                              f"CIRCLE('ICRS',{target_ra:.12f},{target_dec:.12f},{radius_deg:.12f})"
                              ")"
                          )
                      rows = tap_query_csv(simbad_cfg["endpoint"], query)
                      parsed = []
                      for row in rows:
                          ra = safe_float(row.get("ra"))
                          dec = safe_float(row.get("dec"))
                          item = {
                              "main_id": row.get("main_id"),
                              "otype": row.get("otype"),
                              "ra_deg": ra,
                              "dec_deg": dec,
                              "parallax_mas": safe_float(row.get("plx_value")),
                              "radial_velocity_km_s": safe_float(row.get("rvz_radvel")),
                              "bibliography_reference_count": safe_float(row.get("nbref")),
                          }
                          if target_ra is not None and target_dec is not None and ra is not None and dec is not None:
                              item["separation_arcsec"] = angular_separation_arcsec(
                                  target_ra, target_dec, ra, dec
                              )
                          parsed.append(item)
                      if object_name and parsed and target_ra is None and target_dec is None:
                          target_ra = parsed[0]["ra_deg"]
                          target_dec = parsed[0]["dec_deg"]
                          target_origin = "SIMBAD_NAME_RESOLUTION"
                      if target_ra is not None and target_dec is not None:
                          for item in parsed:
                              if (
                                  item.get("separation_arcsec") is None
                                  and item.get("ra_deg") is not None
                                  and item.get("dec_deg") is not None
                              ):
                                  item["separation_arcsec"] = angular_separation_arcsec(
                                      target_ra, target_dec, item["ra_deg"], item["dec_deg"]
                                  )
                          parsed.sort(key=lambda x: x.get("separation_arcsec", float("inf")))
                      results["SIMBAD"] = _catalog_result(
                          "SIMBAD",
                          "MATCH" if parsed else "NO_MATCH",
                          rows=parsed,
                          row_count=len(parsed),
                          query=payload if registry.get("record_query_inputs") else None,
                          endpoint=simbad_cfg["endpoint"],
                      )
                  except Exception as exc:
                      results["SIMBAD"] = _catalog_result(
                          "SIMBAD",
                          "UNAVAILABLE",
                          error=f"{type(exc).__name__}: {exc}",
                          endpoint=simbad_cfg["endpoint"],
                      )

              if target_ra is None or target_dec is None:
                  for service in ["GAIA_DR3", "VIZIER_2MASS"]:
                      if service in requested_services:
                          results[service] = _catalog_result(
                              service,
                              "SKIPPED_TARGET_UNRESOLVED",
                              reason="A coordinate target is required for cone-search catalogues.",
                              endpoint=services[service]["endpoint"],
                          )
                  return {
                      "operation": "astronomy-catalog-context",
                      "status": "PASS",
                      "catalog_context_status": "TARGET_NOT_RESOLVED",
                      "input": payload,
                      "resolved_target": None,
                      "catalog_results": results,
                      "automatic_model_admission": False,
                      "admission_status": "EXTERNAL_REFERENCE_ONLY",
                      "new_physics_claim": "NOT_INFERRED",
                      "follow_up_recommended": True,
                      "next_steps": [
                          next_step(
                              "ASTRO-NEXT-001",
                              "Verify the object identifier or provide ICRS coordinates directly.",
                              "HUMAN_INPUT_VERIFICATION_REQUIRED",
                              "The external catalog layer could not establish a sky position.",
                          ),
                          next_step(
                              "ASTRO-NEXT-002",
                              "Retry authoritative catalogue lookup later if a service was unavailable.",
                              "MODEL_CAN_EXECUTE",
                              "Temporary catalogue/network failures must not be interpreted as absence of an object.",
                          ),
                      ],
                      "q_access_end": accepted["q_access_end"],
                      "accessed_at": accessed_at,
                  }

              # Query official Gaia DR3 archive.
              if "GAIA_DR3" in requested_services:
                  cfg = services["GAIA_DR3"]
                  try:
                      query = (
                          f"SELECT TOP {max_rows} source_id, designation, ra, dec, parallax, "
                          "parallax_error, pmra, pmdec, radial_velocity, phot_g_mean_mag "
                          "FROM gaiadr3.gaia_source "
                          "WHERE 1=CONTAINS("
                          "POINT('ICRS',ra,dec),"
                          f"CIRCLE('ICRS',{target_ra:.12f},{target_dec:.12f},{radius_deg:.12f})"
                          ")"
                      )
                      rows = tap_query_csv(cfg["endpoint"], query)
                      parsed = []
                      for row in rows:
                          ra = safe_float(row.get("ra"))
                          dec = safe_float(row.get("dec"))
                          item = {
                              "source_id": row.get("source_id"),
                              "designation": row.get("designation"),
                              "ra_deg": ra,
                              "dec_deg": dec,
                              "parallax_mas": safe_float(row.get("parallax")),
                              "parallax_error_mas": safe_float(row.get("parallax_error")),
                              "pmra_mas_per_yr": safe_float(row.get("pmra")),
                              "pmdec_mas_per_yr": safe_float(row.get("pmdec")),
                              "radial_velocity_km_s": safe_float(row.get("radial_velocity")),
                              "phot_g_mean_mag": safe_float(row.get("phot_g_mean_mag")),
                          }
                          if ra is not None and dec is not None:
                              item["separation_arcsec"] = angular_separation_arcsec(
                                  target_ra, target_dec, ra, dec
                              )
                          parsed.append(item)
                      parsed.sort(key=lambda x: x.get("separation_arcsec", float("inf")))
                      results["GAIA_DR3"] = _catalog_result(
                          "GAIA_DR3",
                          "MATCH" if parsed else "NO_MATCH",
                          rows=parsed,
                          row_count=len(parsed),
                          endpoint=cfg["endpoint"],
                          data_release="Gaia DR3",
                      )
                  except Exception as exc:
                      results["GAIA_DR3"] = _catalog_result(
                          "GAIA_DR3",
                          "UNAVAILABLE",
                          error=f"{type(exc).__name__}: {exc}",
                          endpoint=cfg["endpoint"],
                      )

              # Query VizieR through a stable, explicit catalogue rather than an unconstrained catalogue sweep.
              if "VIZIER_2MASS" in requested_services:
                  cfg = services["VIZIER_2MASS"]
                  try:
                      query = (
                          f'SELECT TOP {max_rows} RAJ2000, DEJ2000, "2MASS", '
                          "Jmag, e_Jmag, Hmag, e_Hmag, Kmag, e_Kmag, Qflg "
                          'FROM "II/246/out" '
                          "WHERE 1=CONTAINS("
                          "POINT('ICRS',RAJ2000,DEJ2000),"
                          f"CIRCLE('ICRS',{target_ra:.12f},{target_dec:.12f},{radius_deg:.12f})"
                          ")"
                      )
                      rows = tap_query_csv(cfg["endpoint"], query)
                      parsed = []
                      for row in rows:
                          ra = safe_float(row.get("RAJ2000"))
                          dec = safe_float(row.get("DEJ2000"))
                          item = {
                              "2mass_id": row.get("2MASS"),
                              "ra_deg": ra,
                              "dec_deg": dec,
                              "j_mag": safe_float(row.get("Jmag")),
                              "j_mag_error": safe_float(row.get("e_Jmag")),
                              "h_mag": safe_float(row.get("Hmag")),
                              "h_mag_error": safe_float(row.get("e_Hmag")),
                              "k_mag": safe_float(row.get("Kmag")),
                              "k_mag_error": safe_float(row.get("e_Kmag")),
                              "quality_flag": row.get("Qflg"),
                          }
                          if ra is not None and dec is not None:
                              item["separation_arcsec"] = angular_separation_arcsec(
                                  target_ra, target_dec, ra, dec
                              )
                          parsed.append(item)
                      parsed.sort(key=lambda x: x.get("separation_arcsec", float("inf")))
                      results["VIZIER_2MASS"] = _catalog_result(
                          "VIZIER_2MASS",
                          "MATCH" if parsed else "NO_MATCH",
                          rows=parsed,
                          row_count=len(parsed),
                          endpoint=cfg["endpoint"],
                          catalogue="II/246/out",
                      )
                  except Exception as exc:
                      results["VIZIER_2MASS"] = _catalog_result(
                          "VIZIER_2MASS",
                          "UNAVAILABLE",
                          error=f"{type(exc).__name__}: {exc}",
                          endpoint=cfg["endpoint"],
                      )

              statuses = [x["status"] for x in results.values()]
              matches = [name for name, x in results.items() if x["status"] == "MATCH"]
              unavailable = [name for name, x in results.items() if x["status"] == "UNAVAILABLE"]

              if len(matches) >= 2:
                  catalog_context_status = "MULTI_CATALOG_MATCH"
              elif len(matches) == 1:
                  catalog_context_status = "SINGLE_CATALOG_MATCH"
              elif unavailable and len(unavailable) == len(results):
                  catalog_context_status = "EXTERNAL_SERVICES_UNAVAILABLE"
              elif unavailable:
                  catalog_context_status = "PARTIAL_EXTERNAL_CONTEXT"
              else:
                  catalog_context_status = "NO_CATALOG_MATCH"

              if catalog_context_status == "MULTI_CATALOG_MATCH":
                  next_steps = [
                      next_step(
                          "ASTRO-NEXT-001",
                          "Compare the supplied result against the returned catalogue properties using compatible units and epochs.",
                          "MODEL_CAN_EXECUTE",
                          "Multiple independent catalogue services returned positional matches.",
                      ),
                      next_step(
                          "ASTRO-NEXT-002",
                          "If the supplied result materially disagrees with catalogue values, design a reproduction and systematic-error check before physical interpretation.",
                          "MODEL_CAN_DESIGN_TEST",
                          "Catalogue disagreement should be attacked before escalation.",
                      ),
                  ]
                  follow_up = False
              elif catalog_context_status in {"SINGLE_CATALOG_MATCH", "PARTIAL_EXTERNAL_CONTEXT"}:
                  next_steps = [
                      next_step(
                          "ASTRO-NEXT-001",
                          "Retry unavailable catalogues or broaden the cross-check before treating the match as robust.",
                          "MODEL_CAN_EXECUTE",
                          "The external context is incomplete.",
                      ),
                      next_step(
                          "ASTRO-NEXT-002",
                          "Inspect catalogue identifiers, epoch, object type and measurement provenance if the result is scientifically important.",
                          "RESEARCH_AGENT_OR_HUMAN_REQUIRED",
                          "A single-catalogue or partial match needs independent context.",
                      ),
                  ]
                  follow_up = True
              elif catalog_context_status == "NO_CATALOG_MATCH":
                  next_steps = [
                      next_step(
                          "ASTRO-NEXT-001",
                          "Verify coordinates, epoch and search radius.",
                          "HUMAN_INPUT_VERIFICATION_REQUIRED",
                          "A no-match can be caused by target or epoch mismatch.",
                      ),
                      next_step(
                          "ASTRO-NEXT-002",
                          "Search additional authoritative catalogues or literature before classifying the result as unusual.",
                          "RESEARCH_AGENT_OR_HUMAN_REQUIRED",
                          "No match in these services is not evidence that the object or phenomenon is new.",
                      ),
                  ]
                  follow_up = True
              else:
                  next_steps = [
                      next_step(
                          "ASTRO-NEXT-001",
                          "Retry catalogue lookup later.",
                          "MODEL_CAN_EXECUTE",
                          "Service unavailability is a technical state, not a scientific result.",
                      )
                  ]
                  follow_up = True

              return {
                  "operation": "astronomy-catalog-context",
                  "status": "PASS",
                  "catalog_context_status": catalog_context_status,
                  "input": payload,
                  "resolved_target": {
                      "ra_deg": target_ra,
                      "dec_deg": target_dec,
                      "origin": target_origin,
                      "radius_arcsec": radius_arcsec,
                  },
                  "catalog_results": results,
                  "catalogues_matched": matches,
                  "catalogues_unavailable": unavailable,
                  "automatic_model_admission": False,
                  "admission_status": "EXTERNAL_REFERENCE_ONLY",
                  "new_physics_claim": "NOT_INFERRED",
                  "follow_up_recommended": follow_up,
                  "next_steps": next_steps,
                  "q_access_start": accepted["q_access_start"],
                  "q_access_end": accepted["q_access_end"],
                  "accessed_at": accessed_at,
                  "caution": (
                      "External catalogue data are live reference context only. "
                      "They do not expand the Q firewall, change accepted model state, or become evidence "
                      "until ingested through the normal Bubbleverse evidence/update pipeline."
                  ),
              }

          def load_state():
              candidates = [ROOT / "accepted/model_state.json", ROOT / "candidate/candidate_state.json"]
              out = {}
              for p in candidates:
                  if p.exists():
                      out[p.as_posix()] = read_json(p)
              return out

          def model_status():
              states = load_state()
              return {"operation": "model-status", "repository": os.environ.get("GITHUB_REPOSITORY"), "states": states}

          def contradictions():
              p = ROOT / "candidate/contradictions.json"
              if not p.exists():
                  p = ROOT / "accepted/contradictions.json"
              if not p.exists():
                  raise FileNotFoundError("No contradictions.json found")
              return {"operation": "contradictions", "source": p.as_posix(), "data": read_json(p)}

          def provenance():
              p = ROOT / "evidence/evidence_registry.json"
              if not p.exists():
                  raise FileNotFoundError("evidence/evidence_registry.json not found")
              return {"operation": "provenance", "source": p.as_posix(), "data": read_json(p)}

          def release_handoff():
              p = ROOT / "release/MODEL_RELEASE_HANDOFF.json"
              if not p.exists():
                  p = ROOT / "MODEL_RELEASE_HANDOFF.json"
              if not p.exists():
                  raise FileNotFoundError("No release handoff JSON found")
              return {"operation": "release-handoff", "source": p.as_posix(), "data": read_json(p)}

          def scientific_q_scan(max_q: int):
              roots = [ROOT / "candidate", ROOT / "evidence"]
              violations = []
              scanned = 0
              pattern = re.compile(r"\bQ-?0*([0-9]{1,5})\b", flags=re.I)
              for base in roots:
                  if not base.exists():
                      continue
                  for p in base.rglob("*.json"):
                      scanned += 1
                      text = p.read_text(encoding="utf-8")
                      for raw in pattern.findall(text):
                          n = int(raw)
                          if n > max_q:
                              violations.append({"path": p.as_posix(), "q": n})
              return scanned, violations

          def run_model_validate():
              p = ROOT / "tests/programs/model_campaign.py"
              if not p.exists():
                  return {"available": False, "status": "SKIP", "detail": "No model_campaign.py present"}
              cp = subprocess.run([sys.executable, str(p), "validate"], cwd=ROOT, text=True, capture_output=True)
              return {
                  "available": True,
                  "status": "PASS" if cp.returncode == 0 else "FAIL",
                  "returncode": cp.returncode,
                  "stdout": cp.stdout[-12000:],
                  "stderr": cp.stderr[-12000:],
              }

          def context_self_test():
              checks = {}

              registry, accepted = load_result_registry()
              checks["registry_boundary"] = (
                  registry.get("q_access_start") == accepted.get("q_access_start")
                  and registry.get("q_access_end") == accepted.get("q_access_end")
              )

              refs = known_results('{"quantity":"H0","units":"km s^-1 Mpc^-1"}')
              checks["known_h0_results"] = refs["results_count"] >= 1

              exact = contextualize_result(
                  '{"quantity":"H0","value":73.5,"sigma":0.81,"units":"km s^-1 Mpc^-1"}'
              )
              checks["known_reference_match"] = (
                  exact["span_status"] == "WITHIN_REGISTERED_REFERENCE_SPAN"
                  and abs(exact["nearest_registered_result"]["gaussian_distance_sigma"]) < 1e-12
              )

              outlier = contextualize_result(
                  '{"quantity":"H0","value":1150.0,"sigma":0.81,"units":"km s^-1 Mpc^-1"}'
              )
              checks["outlier_followup"] = (
                  outlier["span_status"] == "OUTSIDE_REGISTERED_REFERENCE_SPAN"
                  and outlier["follow_up_recommended"] is True
                  and outlier["new_physics_claim"] == "NOT_INFERRED"
              )

              unknown = contextualize_result(
                  '{"quantity":"UNREGISTERED_TEST_QUANTITY","value":1.0,"units":"arb"}'
              )
              checks["unknown_routes_external"] = (
                  unknown["registry_match_status"] == "UNREGISTERED_QUANTITY"
                  and any(x["executor"] == "RESEARCH_AGENT_OR_HUMAN_REQUIRED" for x in unknown["next_steps"])
              )

              if not all(checks.values()):
                  raise AssertionError(checks)
              return checks

          def full_test():
              tests = []
              def check(test_id, name, fn):
                  try:
                      detail = fn()
                      tests.append({"id": test_id, "name": name, "status": "PASS", "detail": detail})
                  except Exception as e:
                      tests.append({"id": test_id, "name": name, "status": "FAIL", "detail": f"{type(e).__name__}: {e}"})

              check("SELF-001", "Repository model structure", lambda: all((ROOT/x).exists() for x in ["candidate","accepted","evidence","tests","release"]) or (_ for _ in ()).throw(AssertionError("Required model directories missing")))

              def state_test():
                  p = ROOT / "candidate/candidate_state.json"
                  if not p.exists():
                      raise AssertionError("candidate/candidate_state.json missing")
                  s = read_json(p)
                  start, end, cur = map(q_number, [s.get("q_access_start"), s.get("q_access_end"), s.get("current_q")])
                  if None in (start,end,cur) or not (start <= cur <= end):
                      raise AssertionError(f"Invalid Q boundary: start={start}, current={cur}, end={end}")
                  return {"q_access_start": start, "current_q": cur, "q_access_end": end}
              check("SELF-002", "Dynamic Q-boundary state", state_test)

              def firewall_test():
                  s = read_json(ROOT / "candidate/candidate_state.json")
                  end = q_number(s.get("q_access_end"))
                  if end is None:
                      raise AssertionError("Cannot parse q_access_end")
                  scanned, violations = scientific_q_scan(end)
                  if violations:
                      raise AssertionError(f"High-Q contamination: {violations[:10]}")
                  return {"json_files_scanned": scanned, "max_allowed_q": end, "violations": 0}
              check("SELF-003", "High-Q contamination firewall", firewall_test)

              def json_test():
                  bad=[]; count=0
                  for base in [ROOT/"candidate", ROOT/"accepted", ROOT/"evidence", ROOT/"tests", ROOT/"release", ROOT/"model"]:
                      if not base.exists(): continue
                      for p in base.rglob("*.json"):
                          count += 1
                          try: read_json(p)
                          except Exception as e: bad.append(f"{p}: {e}")
                  if bad: raise AssertionError(bad[:10])
                  return {"json_files_parsed": count}
              check("SELF-004", "JSON/schema parse health", json_test)

              check("SELF-005", "Difference calculation", lambda: difference("73.5,67.24") if abs(difference("73.5,67.24")["delta"]-6.26) < 1e-10 else (_ for _ in ()).throw(AssertionError("wrong difference")))
              check("SELF-006", "Gaussian tension calculation", lambda: gaussian_tension("73.50,0.81,67.24,0.35") if abs(gaussian_tension("73.50,0.81,67.24,0.35")["tension_sigma"]-7.094423883870192) < 1e-10 else (_ for _ in ()).throw(AssertionError("wrong tension")))
              check("SELF-007", "Percent-shift calculation", lambda: percent_shift("147,140") if abs(percent_shift("147,140")["percent_change"]+4.761904761904762) < 1e-10 else (_ for _ in ()).throw(AssertionError("wrong percent shift")))
              check("SELF-008", "Weighted-mean calculation", lambda: weighted_mean("10,1,20,2") if abs(weighted_mean("10,1,20,2")["weighted_mean"]-12.0) < 1e-10 else (_ for _ in ()).throw(AssertionError("wrong weighted mean")))

              def rejection_test():
                  rejected = 0
                  for fn, bad in [(gaussian_tension,"1,0,2,1"),(percent_shift,"0,1"),(weighted_mean,"1,-1,2,1"),(difference,"1,2,3")]:
                      try: fn(bad)
                      except Exception: rejected += 1
                  if rejected != 4: raise AssertionError(f"Only {rejected}/4 invalid inputs rejected")
                  return {"invalid_inputs_rejected": rejected}
              check("SELF-009", "Invalid-input rejection", rejection_test)

              check("SELF-010", "Model status reader", lambda: model_status())
              check("SELF-011", "Contradiction registry reader", lambda: contradictions())
              check("SELF-012", "Provenance registry reader", lambda: provenance())
              check("SELF-013", "Release handoff reader", lambda: release_handoff())

              def campaign_validation():
                  r = run_model_validate()
                  if r["status"] == "FAIL":
                      raise AssertionError(r)
                  return r
              check("SELF-014", "Current scientific/model campaign validation", campaign_validation)

              def accepted_immutability_test():
                  state_path = ROOT / "accepted/model_state.json"
                  if not state_path.exists():
                      return {"status": "NO_ACCEPTED_MODEL", "detail": "No accepted model exists yet; immutability check not applicable."}
                  state = read_json(state_path)
                  if state.get("status") != "ACCEPTED":
                      return {"status": "NO_ACCEPTED_MODEL", "detail": f"accepted/model_state.json status={state.get('status')}"}
                  version = state.get("accepted_model_version")
                  if not version:
                      raise AssertionError("Accepted model has no accepted_model_version")
                  snapshot = ROOT / "versions/accepted" / str(version)
                  if not snapshot.exists():
                      raise AssertionError(f"Accepted snapshot missing: {snapshot.relative_to(ROOT)}")
                  names = [
                      "MODEL_CURRENT.md", "model_state.json", "constraints.json",
                      "contradictions.json", "mechanisms.json", "observations.json",
                      "predictions.json", "robustness.json"
                  ]
                  checked = []
                  mismatches = []
                  for name in names:
                      live = ROOT / "accepted" / name
                      frozen = snapshot / name
                      if not live.exists() or not frozen.exists():
                          mismatches.append({"file": name, "reason": "missing live or frozen copy"})
                          continue
                      live_sha = hashlib.sha256(live.read_bytes()).hexdigest()
                      frozen_sha = hashlib.sha256(frozen.read_bytes()).hexdigest()
                      checked.append({"file": name, "sha256": live_sha})
                      if live_sha != frozen_sha:
                          mismatches.append({"file": name, "live_sha256": live_sha, "snapshot_sha256": frozen_sha})
                  if mismatches:
                      raise AssertionError(f"Accepted model differs from frozen {version} snapshot: {mismatches}")
                  return {"accepted_version": version, "files_compared": len(checked), "mismatches": 0}
              check("SELF-015", "Accepted model immutability", accepted_immutability_test)

              def accepted_path_isolation_test():
                  p = ROOT / "accepted/model_state.json"
                  if not p.exists():
                      return {"status": "NO_ACCEPTED_MODEL", "detail": "No accepted model exists yet; path isolation not applicable."}
                  state = read_json(p)
                  if state.get("status") != "ACCEPTED":
                      return {"status": "NO_ACCEPTED_MODEL", "detail": f"accepted/model_state.json status={state.get('status')}"}
                  layers = state.get("layers")
                  if not isinstance(layers, dict) or not layers:
                      raise AssertionError("Accepted model has no layer map")
                  errors = []
                  resolved = {}
                  accepted_root = (ROOT / "accepted").resolve()
                  for layer, raw in layers.items():
                      if not isinstance(raw, str) or not raw:
                          errors.append({"layer": layer, "reason": "empty/non-string path"})
                          continue
                      rel = Path(raw)
                      target = (ROOT / rel).resolve()
                      resolved[layer] = rel.as_posix()
                      try:
                          target.relative_to(accepted_root)
                      except ValueError:
                          errors.append({"layer": layer, "path": raw, "reason": "accepted layer escapes accepted/"})
                          continue
                      if not target.exists():
                          errors.append({"layer": layer, "path": raw, "reason": "target missing"})
                  if errors:
                      raise AssertionError(f"Accepted layer isolation failed: {errors}")
                  return {"layers_checked": len(layers), "paths": resolved}
              check("SELF-016", "Accepted path isolation", accepted_path_isolation_test)

              def promotion_consistency_test():
                  rp = ROOT / "release/MODEL_RELEASE_HANDOFF.json"
                  ap = ROOT / "accepted/model_state.json"
                  cp = ROOT / "candidate/candidate_state.json"
                  if not rp.exists():
                      raise AssertionError("release/MODEL_RELEASE_HANDOFF.json missing")
                  release = read_json(rp)
                  promoted = bool(release.get("candidate_promoted"))
                  if not promoted:
                      return {"candidate_promoted": False, "status": "NO_PROMOTION_RECORDED"}
                  if not ap.exists() or not cp.exists():
                      raise AssertionError("Promotion is recorded but accepted/candidate state is missing")
                  accepted = read_json(ap)
                  candidate = read_json(cp)
                  accepted_version = release.get("accepted_model_after")
                  candidate_version = release.get("candidate_model")
                  errors = []
                  if accepted.get("status") != "ACCEPTED":
                      errors.append(f"accepted.status={accepted.get('status')!r}")
                  if accepted.get("accepted_model_version") != accepted_version:
                      errors.append(f"accepted version {accepted.get('accepted_model_version')!r} != release {accepted_version!r}")
                  if candidate.get("candidate_model_version") != candidate_version:
                      errors.append(f"candidate version {candidate.get('candidate_model_version')!r} != release {candidate_version!r}")
                  promotion_status = candidate.get("promotion_status")
                  allowed = {"PROMOTED", "PROMOTED_TO_ACCEPTED", f"PROMOTED_TO_{accepted_version}"}
                  if promotion_status not in allowed:
                      errors.append(f"candidate promotion_status={promotion_status!r}; expected one of {sorted(allowed)}")
                  if errors:
                      raise AssertionError("Promotion state inconsistency: " + "; ".join(errors))
                  return {
                      "candidate_model": candidate_version,
                      "accepted_model": accepted_version,
                      "candidate_promotion_status": promotion_status,
                      "consistent": True
                  }
              check("SELF-017", "Promotion state consistency", promotion_consistency_test)

              def commit_provenance_test():
                  p = ROOT / "release/MODEL_RELEASE_HANDOFF.json"
                  if not p.exists():
                      raise AssertionError("release/MODEL_RELEASE_HANDOFF.json missing")
                  release = read_json(p)
                  sha = str(release.get("model_repository_commit") or "").strip()
                  if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                      raise AssertionError(f"model_repository_commit is not a real 40-hex Git SHA: {sha!r}")
                  cp = subprocess.run(
                      ["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                      cwd=ROOT, text=True, capture_output=True
                  )
                  if cp.returncode != 0:
                      raise AssertionError(f"Recorded model_repository_commit is not present in repository history: {sha}")
                  return {"model_repository_commit": sha, "reachable_commit": True}
              check("SELF-018", "Real commit provenance", commit_provenance_test)

              check("SELF-019", "Known-result context and next-step router", context_self_test)
              check("SELF-020", "External astronomy catalog configuration", astronomy_catalog_config_self_test)

              passed = sum(t["status"] == "PASS" for t in tests)
