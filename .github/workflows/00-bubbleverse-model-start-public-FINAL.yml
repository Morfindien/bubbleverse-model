                  raise SystemExit(1)
          except Exception as exc:
              failure = {"operation": OP, "status": "FAIL", "error": f"{type(exc).__name__}: {exc}"}
              write_result(failure)
              add_summary(["# Bubbleverse Model", "", f"**Operation:** `{OP}`", "**Status:** FAIL", f"**Error:** `{failure['error']}`"])
              print(json.dumps(failure, indent=2))
              raise
          PY

      - name: Commit model changes
        if: ${{ inputs.operation == 'campaign' || inputs.operation == 'install-context-engine' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bubbleverse-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ inputs.operation }}" == "campaign" ]]; then
            git add accepted candidate evidence provenance changelog versions tests release bubbleverse_model_program_registry.json 2>/dev/null || true
            MSG="Run Bubbleverse model campaign"
          else
            git add model README.md changelog bubbleverse_model_program_registry.json 2>/dev/null || true
            MSG="Install Bubbleverse result context engine"
          fi

          if git diff --cached --quiet; then
            echo "Operation produced no repository changes."
            exit 0
          fi

          git commit -m "$MSG"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bubbleverse-model-${{ inputs.operation }}-${{ github.run_number }}
          path: run-output/
          if-no-files-found: warn
