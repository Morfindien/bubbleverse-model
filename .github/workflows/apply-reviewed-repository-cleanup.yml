name: Apply reviewed repository cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bubbleverse-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Morfindien/bubbleverse-model' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out default branch and complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit and validate reviewed contents-only cleanup
        shell: bash
        env:
          BV_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          PAYLOAD_SHA256 = '16ae7b74339a466a08839b18e15948683a939347b67c62e6e8158b5cf1839c11'
          PAYLOAD_B64 = ''
          """Apply a reviewed contents-only cleanup; no workflow edits, promotions or pushes."""
          from pathlib import Path
          import base64,hashlib,json,os,subprocess,sys,zlib
          from datetime import datetime,timezone

          def git(repo,*args):
           p=subprocess.run(['git',*args],cwd=repo,text=True,capture_output=True)
           if p.returncode:raise RuntimeError('Git check failed: '+' '.join(args)+'\n'+p.stdout+p.stderr)
           return p.stdout.strip()

          def digest(path):return hashlib.sha256(path.read_bytes()).hexdigest()

          def guard_checkout(repo,p):
           repo=Path(repo).resolve()
           if git(repo,'status','--porcelain','--untracked-files=all'):raise RuntimeError('Uncommitted files: cleanup blocked')
           target=git(repo,'config','--get','remote.origin.url').lower().rstrip('/').removesuffix('.git')
           if target not in {'https://github.com/morfindien/bubbleverse-model','git@github.com:morfindien/bubbleverse-model','ssh://git@github.com/morfindien/bubbleverse-model'}:raise RuntimeError('Wrong target repository')
           if git(repo,'branch','--show-current')!=os.environ.get('BV_DEFAULT_BRANCH',p.get('default_branch','main')):raise RuntimeError('Use the default branch')
           git(repo,'merge-base','--is-ancestor',p['baseline_head'],'HEAD')
           if set(p['updates'])!={'README.md','tests/TEST_PLAN_CURRENT.md'}:raise RuntimeError('Only reviewed operational documentation may be updated')
           archive=p['archive'];paths=set(p['updates'])|{archive['old_path'],archive['new_path'],p['archive_index'],p['record']}
           if any(x.startswith('.github/') or '..' in Path(x).parts or Path(x).is_absolute() for x in paths):raise RuntimeError('Workflow/unsafe path in cleanup transaction')
           if any(x.startswith(('accepted/','candidate/','model/','evidence/','release/','versions/','tests/results/','tests/preregistration/','changelog/')) for x in paths):raise RuntimeError('Protected layer mutation blocked')
           if not all(x.startswith('provenance/cleanup/') for x in [archive['new_path'],p['archive_index'],p['record']]):raise RuntimeError('Invalid provenance destination')
           tracked=set(git(repo,'ls-files').splitlines());head=git(repo,'rev-parse','HEAD');done=(repo/p['record']).is_file();expected=set(p['baseline_hashes'])
           if done:expected=(expected-{archive['old_path']})|{archive['new_path'],p['archive_index'],p['record']}
           if tracked!=expected:raise RuntimeError('Repository files changed outside the uploaded workflow and reviewed transaction')
           for path,h in p['baseline_hashes'].items():
            if path==p['self_workflow'] or done and path in paths:continue
            f=repo/path
            if not f.is_file() or f.is_symlink() or digest(f)!=h:raise RuntimeError('Audited input changed: '+path)
           if done:
            rec=json.loads((repo/p['record']).read_text())
            if not all(rec.get(k) is False for k in ['scientific_change','accepted_state_changed','q_boundary_changed','model_version_changed']):raise RuntimeError('Invalid completed transaction invariants')
            if rec.get('validation_state')!='ALL_APPLICABLE_LOCAL_GATES_PASS' or rec.get('post_cleanup_tests',{}).get('NON_DESTRUCTIVE')!='PASS':raise RuntimeError('Completed transaction lacks full validation')
            git(repo,'merge-base','--is-ancestor',rec['head_before'],'HEAD')
            if digest(repo/archive['new_path'])!=archive['sha256']:raise RuntimeError('Archived source identity changed')
            for path,s in p['updates'].items():
             if (repo/path).read_text()!=s:raise RuntimeError('Reviewed documentation no longer matches')
            for path,h in rec['protected_hashes'].items():
             if not (repo/path).is_file() or digest(repo/path)!=h:raise RuntimeError('Previously protected file changed: '+path)
            return {'status':'ALREADY_APPLIED','head':head,'paths':paths}
           for path in [archive['new_path'],p['archive_index'],p['record']]:
            if (repo/path).exists() or (repo/path).is_symlink():raise RuntimeError('Archive/record destination exists')
           if digest(repo/archive['old_path'])!=archive['sha256']:raise RuntimeError('Original report identity changed')
           protected={path:digest(repo/path) for path in tracked if path not in paths}
           original={path:(repo/path).read_bytes() for path in paths if (repo/path).is_file()}
           return {'status':'READY','head':head,'paths':paths,'protected':protected,'original':original}

          def apply_changes(repo,p,g):
           repo=Path(repo);archive=dict(p['archive']);archive['git_blob_sha']=git(repo,'rev-parse',g['head']+':'+archive['old_path'])
           old=repo/archive['old_path'];new=repo/archive['new_path'];new.parent.mkdir(parents=True,exist_ok=True);old.rename(new)
           index={'head_before':g['head'],'reference_scope':'HISTORICAL_GIT_OBJECTS_AT_HEAD_BEFORE','scientific_change':False,'archives':[archive]}
           (repo/p['archive_index']).write_text(json.dumps(index,indent=2,sort_keys=True)+'\n')
           for path,s in p['updates'].items():(repo/path).write_text(s)
           git(repo,'add','-A','--',*sorted(g['paths']-{p['record']}))

          def restore_changes(repo,p,g):
           git(repo,'reset','HEAD','--',*sorted(g['paths']))
           for path in g['paths']:
            f=Path(repo)/path
            if path in g['original']:f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(g['original'][path])
            elif f.is_file():f.unlink()
           if git(repo,'status','--porcelain'):raise RuntimeError('Rollback incomplete; inspect checkout')

          def main(payload):
           sys.path.insert(0,str(Path.cwd()))
           import repository_cleanup as engine
           repo=Path.cwd();work=Path(os.environ.get('RUNNER_TEMP',repo.parent/'upload-cleanup-validation'))/'reviewed-cleanup-validation';work.mkdir(parents=True,exist_ok=True)
           g=guard_checkout(repo,payload);(work/'head-input.txt').write_text(g['head']+'\n')
           audit,_=engine.audit(repo);(work/'full-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
           pre_dir=work/'pre';pre_dir.mkdir(exist_ok=True);pre=engine.validate(repo,pre_dir)
           if g['status']=='ALREADY_APPLIED':
            result={'cleanup_status':'PARTIAL_CLEAN','already_applied':True,'validation':pre,'deferred_actions':payload['deferred_actions'],'scientific_change':False};(work/'result.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2));return
           try:
            # Only the unique root report is moved; existing installers and all workflows remain.
            entries,texts,documents,errors,_=engine.inventory(repo)
            if errors:raise RuntimeError('Repository parse failures')
            old=payload['archive']['old_path'];inbound=set(entries[old]['referenced_by'])-{payload['self_workflow']}
            if inbound:raise RuntimeError('Live reference prevents archive: '+str(sorted(inbound)))
            apply_changes(repo,payload,g)
            post_dir=work/'post';post_dir.mkdir(exist_ok=True);post=engine.validate(repo,post_dir)
            for path,h in g['protected'].items():
             if not (repo/path).is_file() or digest(repo/path)!=h:raise RuntimeError('Protected bytes changed: '+path)
            if digest(repo/payload['archive']['new_path'])!=payload['archive']['sha256']:raise RuntimeError('Archive bytes changed')
            changed=set(git(repo,'diff','--cached','--no-renames','--name-only').splitlines())
            if changed!=g['paths']-{payload['record']} or any(x.startswith('.github/') for x in changed):raise RuntimeError('Unexpected structural diff')
            rec={'schema_version':'1.0','target_repo':'Morfindien/bubbleverse-model','mode':'CLEAN','date_time':datetime.now(timezone.utc).isoformat(),'head_before':g['head'],'audited_base':payload['baseline_head'],'reference_scope':'HISTORICAL_GIT_OBJECTS_AT_HEAD_BEFORE','cleanup_status':'PARTIAL_CLEAN','validation_state':'ALL_APPLICABLE_LOCAL_GATES_PASS','scientific_change':False,'accepted_state_changed':False,'q_boundary_changed':False,'model_version_changed':False,'deletion_ledger':[],'archive_ledger':[payload['archive']],'update_ledger':payload['update_ledger'],'deferred_actions':payload['deferred_actions'],'protected_hashes':g['protected'],'pre_cleanup_tests':pre,'post_cleanup_tests':post,'publication_semantics':'Published only when this record-containing commit is reachable on remote main; real publication commit verified outside its own content.'}
            f=repo/payload['record'];f.parent.mkdir(parents=True,exist_ok=True);f.write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n');git(repo,'add',payload['record']);git(repo,'diff','--cached','--check')
            if set(git(repo,'diff','--cached','--no-renames','--name-only').splitlines())!=g['paths']:raise RuntimeError('Unexpected final staged diff')
            result={k:v for k,v in rec.items() if k!='protected_hashes'};(work/'result.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
           except Exception:
            restore_changes(repo,payload,g);raise

          if __name__=='__main__':
           raw=zlib.decompress(base64.b64decode(PAYLOAD_B64,validate=True))
           if hashlib.sha256(raw).hexdigest()!=PAYLOAD_SHA256:raise RuntimeError('Reviewed payload hash mismatch')
           main(json.loads(raw))
          PY
      - name: Commit and publish only ordinary files
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected=$(cat "$RUNNER_TEMP/reviewed-cleanup-validation/head-input.txt")
          actual=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          test "$actual" = "$expected"
          git diff --cached --name-only --no-renames > "$RUNNER_TEMP/reviewed-cleanup-validation/changed-paths.txt"
          if grep -q '^.github/' "$RUNNER_TEMP/reviewed-cleanup-validation/changed-paths.txt"; then
            echo 'Blocked: workflow file mutation in publication transaction.'
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='Bubbleverse Repository Cleanup' -c user.email='repository-cleanup@users.noreply.github.com' commit -m 'Repository cleanup: archive historical root report and sync current validation guide'
          fi
          git diff --name-only --no-renames "$expected" HEAD > "$RUNNER_TEMP/reviewed-cleanup-validation/published-paths.txt"
          if grep -q '^.github/' "$RUNNER_TEMP/reviewed-cleanup-validation/published-paths.txt"; then
            echo 'Blocked: workflow file mutation before push.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          actual=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          test "$actual" = "$(git rev-parse HEAD)"
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-cleanup-validation/remote-verified-commit.txt"
          {
            echo '## PARTIAL_CLEAN — safe structural changes published'
            echo 'Scientific state, accepted model, Q boundary and snapshots preserved.'
            echo 'Workflow-dependent installers retained because contents tokens cannot change workflow files.'
            echo "Verified remote commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve full audit and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-repository-cleanup-validation
          path: ${{ runner.temp }}/reviewed-cleanup-validation/
          if-no-files-found: warn
