name: Apply reviewed repository cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bubbleverse-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Morfindien/bubbleverse-model' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit, apply exact reviewed patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, subprocess, tempfile
          import repository_cleanup as engine
          repo=Path.cwd()
          BASE='153713357ad029f05a32a45e9189c3ae3293aff1'
          PATCH_B64=''
          PATCH_HASH='1acf1da6c1ffbba279020b8b5e9409b6b11f6dfd96c524dff1d42e3e77a2ed47'
          SELF='.github/workflows/apply-reviewed-repository-cleanup.yml'
          RECORD='provenance/cleanup/cleanup_'+BASE+'.json'
          EXPECTED={'.github/workflows/install-q045-model-v07.yml','.github/workflows/repository-cleanup-current.yml','tests/TEST_PLAN_CURRENT.md','tests/test_registry.json',RECORD}
          def git(*args):
           return subprocess.check_output(['git',*args],text=True).strip()
          assert git('status','--porcelain')=='', 'Tracked or untracked local changes; no cleanup applied'
          subprocess.run(['git','merge-base','--is-ancestor',BASE,'HEAD'],check=True)
          assert set(git('diff','--name-only',BASE,'HEAD').splitlines())<={SELF}, 'Repository changed since audited input; new audit required'
          assert hashlib.sha256((repo/'repository_cleanup.py').read_bytes()).hexdigest()=='7412717b64c32d5225ee8c614341a86d9ccbb31975a5046220ea4695c5bd09b1'
          patch=base64.b64decode(PATCH_B64,validate=True)
          assert hashlib.sha256(patch).hexdigest()==PATCH_HASH
          head_before=git('rev-parse','HEAD')
          work=Path(os.environ.get('RUNNER_TEMP',tempfile.gettempdir()))/'reviewed-cleanup-validation'
          work.mkdir(exist_ok=True)
          entries,_,documents,errors,_=engine.inventory(repo)
          assert not errors
          before={p:e['sha256'] for p,e in entries.items()}
          audit,_=engine.audit(repo)
          (work/'full-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          pre_dir=work/'pre';pre_dir.mkdir(exist_ok=True)
          pre=engine.validate(repo,pre_dir)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          # Only the delivery workflow is additional to the exact reviewed patch.
          if (repo/SELF).exists():(repo/SELF).unlink()
          subprocess.run(['git','add','--all'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==EXPECTED|({SELF} if SELF in before else set())
          post_dir=work/'post';post_dir.mkdir(exist_ok=True)
          post=engine.validate(repo,post_dir)
          after,retained_texts,documents,errors,_=engine.inventory(repo)
          assert not errors
          for p,h in before.items():
           if p not in EXPECTED and p!=SELF:assert p in after and after[p]['sha256']==h, p+' changed unexpectedly'
          state=engine.discover(repo,documents)
          assert not engine.metadata_updates(repo,after,documents,state)
          assert (repo/'Bubbleverse_Q045_v0.7.bundle').exists()
          deleted=set(before)-set(after)
          for p,text in retained_texts.items():
           if engine.historical_reference(repo,p,documents):continue
           for target in deleted:
            assert target not in text and Path(target).name not in text, 'Retained reference to deleted target: '+p+' -> '+target
          subprocess.run(['git','diff','--cached','--check'],check=True)
          result={'head_input':head_before,'audited_base':BASE,'scientific_change':False,'accepted_state_changed':False,'model_version_changed':False,'q_boundary_changed':False,'cleanup_status':'PARTIAL_CLEAN','pre_cleanup_tests':pre,'post_cleanup_tests':post,'review_required':['Bubbleverse_Q045_v0.7.bundle'],'delivery_workflow_removed':True}
          (work/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if os.environ.get('GITHUB_ACTIONS')=='true':
           branch=os.environ['GITHUB_REF_NAME']
           remote=git('ls-remote','origin','refs/heads/'+branch).split()[0]
           assert remote==head_before, 'Concurrent remote change; commit blocked'
          subprocess.run(['git','-c','user.name=Bubbleverse Repository Cleanup','-c','user.email=bubbleverse-cleanup@users.noreply.github.com','commit','-m','Repository cleanup: retire completed installer and sync validation metadata'],check=True)
          (work/'head-input.txt').write_text(head_before+'\n')
          PY
      - name: Publish only if remote HEAD is unchanged
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected=$(cat "$RUNNER_TEMP/reviewed-cleanup-validation/head-input.txt")
          actual=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          test "$actual" = "$expected"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          actual=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          test "$actual" = "$(git rev-parse HEAD)"
          echo "PARTIAL_CLEAN: cleanup published; historical bundle preserved." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve audit and validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-repository-cleanup-validation
          path: ${{ runner.temp }}/reviewed-cleanup-validation/
          if-no-files-found: warn
