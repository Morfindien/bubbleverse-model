name: "🩹 BUBBLEVERSE MODEL — Q040 CONSISTENCY REPAIR"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-q040-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair Q040 consistency
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Q040 repair must run from main."
            exit 1
          fi

          test -f Q040_MODEL_REPAIR.py

          python - <<'PY'
          from pathlib import Path
          source = Path("Q040_MODEL_REPAIR.py").read_text(encoding="utf-8")
          compile(source, "Q040_MODEL_REPAIR.py", "exec")
          print("REPAIR_SYNTAX_GATE=PASS")
          PY

          python Q040_MODEL_REPAIR.py --repo .

      - name: Validate formal model
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/formal_model_validate.py

      - name: Validate current model campaign
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/model_campaign.py validate

      - name: Validate Q040 semantics
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/q040_model_validate.py

      - name: Repair self-check
        shell: bash
        run: |
          set -euo pipefail
          python Q040_MODEL_REPAIR.py --repo . --check-only

      - name: Commit repaired consistency state
        shell: bash
        run: |
          set -euo pipefail

          git add \
            candidate \
            model \
            release \
            versions/accepted/v0.2 \
            tests/programs/model_campaign.py \
            changelog/MODEL_CHANGELOG.md \
            bubbleverse_model_program_registry.json \
            Q040_MODEL_REPAIR_REPORT.json

          if git diff --cached --quiet; then
            echo "No repair changes were required."
            exit 0
          fi

          git commit -m "Repair Q040 model consistency gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Bubbleverse Q040 consistency repair"
            echo
            echo "- Scientific state changed: **NO**"
            echo "- Accepted state remains: **Q040 / v0.2 / R000002**"
            echo "- Repair scope: candidate metadata, formal/context boundary, validator, snapshot, release consistency"
            echo "- Q040 TECHNICAL_FAIL remains non-physical falsification"
            echo
            if [[ -f Q040_MODEL_REPAIR_REPORT.json ]]; then
              echo '```json'
              cat Q040_MODEL_REPAIR_REPORT.json
              echo
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
