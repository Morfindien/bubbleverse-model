      - name: Install formal Bubbleverse model layer
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/install_formal_model.py

      - name: Validate formal model layer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/programs/formal_model_validate.py tests/programs/model_campaign.py
          python tests/programs/formal_model_validate.py --write-result
          python tests/programs/model_campaign.py validate

      - name: Commit and push formal layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bubbleverse-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             model             tests/programs/formal_model_validate.py             tests/programs/model_campaign.py             tests/results/FORMAL-MODEL-v0.1-001.json             changelog/MODEL_CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Formal model layer is already installed and current."
            exit 0
          fi

          git commit -m "Install Bubbleverse formal model layer"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Installation complete
        shell: bash
        run: |
          echo "BUBBLEVERSE FORMAL MODEL LAYER: INSTALLED"
          echo "Next: run 🧪 BUBBLEVERSE MODEL — START with operation=test"
