name: "🧹 BUBBLEVERSE MODEL — ONE-TIME CLEANUP"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Audit and apply structural cleanup
        shell: bash
        env:
          AUDIT_HEAD_BEFORE: c5ce68196619ebabe0877400e672104be9da665e
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          AUDIT_HEAD = os.environ["AUDIT_HEAD_BEFORE"]

          def load(path):
              return json.loads((ROOT / path).read_text(encoding="utf-8"))

          def save(path, obj):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def file_sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          # The audited scientific baseline must remain in this branch history.
          # Protected-state hashes and canonical assertions below guard against scientific drift.
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", AUDIT_HEAD, "HEAD"],
              text=True,
              capture_output=True,
          ).returncode == 0
          if not ancestor:
              raise SystemExit(
                  f"Audited baseline {AUDIT_HEAD} is not an ancestor of current HEAD {head}. "
                  "Re-audit before cleaning."
              )

          accepted = load("accepted/model_state.json")
          release = load("release/MODEL_RELEASE_HANDOFF.json")
          manifest = load("model/model_manifest.json")

          assert accepted["status"] == "ACCEPTED"
          assert accepted["current_q"] == "Q040"
          assert accepted["q_access_end"] == "Q040"
          assert accepted["accepted_model_version"] == "v0.2"
          assert accepted["model_revision"] == "R000002"
          assert release["release_status"] == "ALL_GREEN"
          assert release["candidate_promoted"] is True
          assert manifest["accepted_model_version"] == "v0.2"
          assert manifest["q_access_end"] == "Q040"

          protected_roots = [
              ROOT / "accepted",
              ROOT / "versions/accepted",
              ROOT / "evidence",
              ROOT / "model",
              ROOT / "candidate",
              ROOT / "tests/programs",
              ROOT / "tests/preregistration",
              ROOT / "tests/results",
          ]
          protected_exact = [ROOT / "release/MODEL_RELEASE_HANDOFF.json"]

          def fingerprint():
              result = {}
              for base in protected_roots:
                  if not base.exists():
                      continue
                  for p in sorted(base.rglob("*")):
                      if p.is_file():
                          result[p.relative_to(ROOT).as_posix()] = file_sha(p)
              for p in protected_exact:
                  result[p.relative_to(ROOT).as_posix()] = file_sha(p)
              return result

          before = fingerprint()

          delete_paths = [
              ".github/workflows/q040-model-update.yml",
              ".github/workflows/q040-model-repair.yml",
              "Q040_MODEL_UPDATE_INSTALL.py",
              "Q040_MODEL_UPDATE_MANIFEST.json",
              "Q040_MODEL_UPDATE_REPORT.md",
              "Q040_MODEL_REPAIR.py",
              "Q040_MODEL_REPAIR_REPORT.json",
              "README-updated-final.md",
          ]
          self_path = ".github/workflows/repository-cleanup-once.yml"
          delete_group = set(delete_paths + [self_path])

          # PRE-DELETE GATE — no references outside the files removed together.
          for target in delete_paths:
              p = ROOT / target
              if not p.exists():
                  raise SystemExit(f"FILE_EXISTS failed: {target}")

              needles = {target, Path(target).name}
              hits = []
              for candidate in ROOT.rglob("*"):
                  if not candidate.is_file() or ".git" in candidate.parts:
                      continue
                  rel = candidate.relative_to(ROOT).as_posix()
                  if rel in delete_group:
                      continue
                  try:
                      text = candidate.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  if any(needle in text for needle in needles):
                      hits.append(rel)

              if hits:
                  raise SystemExit(f"REFERENCE_SCAN failed for {target}: {hits}")

          for target in delete_paths:
              (ROOT / target).unlink()

          # README — documentation sync only.
          readme_path = ROOT / "README.md"
          readme = readme_path.read_text(encoding="utf-8")
          replacements = {
              "- Mode: **BOOTSTRAP_MODE — accepted baseline established**":
                  "- Mode: **INCREMENTAL_UPDATE — Q040 accepted**",
              "- Authorized scientific range: **Q001–Q039**":
                  "- Authorized scientific range: **Q001–Q040**",
              "- Current Q: **Q039**": "- Current Q: **Q040**",
              "- Accepted model: **v0.1**": "- Accepted model: **v0.2**",
              "- Candidate history: **v0.1-candidate → promoted to v0.1**":
                  "- Candidate history: **v0.2 candidate → promoted to v0.2**",
              "- Formal model: **v0.1-formalization-3**":
                  "- Formal model: **v0.2-formalization-1**",
              "Q001–Q039\n```": "Q001–Q040\n```",
          }
          for old, new in replacements.items():
              readme = readme.replace(old, new)

          anchor = "- Formal-model validation: **12 / 12 PASS**\n"
          if "Public system healthcheck" not in readme and anchor in readme:
              readme = readme.replace(
                  anchor,
                  anchor + "- Public system healthcheck: **20 / 20 PASS**\n",
                  1,
              )

          old_campaign = '''### campaign

Runs the explicit model campaign.

This operation may modify model state and may promote a candidate when all mandatory gates pass.

Do not use `campaign` if you only want to inspect the model.

Use:

```text
test
```

or:

```text
validate-model
```

instead.
'''
          new_campaign = '''### campaign

Runs the current scientific/model validation campaign and may write a validation record under `tests/results/`.

In the current implementation it does **not** promote a candidate, expand the Q boundary, or alter accepted scientific state. Scientific promotion belongs to the controlled model-update pipeline.

Use `test` for the complete non-destructive system healthcheck and `validate-model` for direct model validation.
'''
          readme = readme.replace(old_campaign, new_campaign)
          readme_path.write_text(readme, encoding="utf-8")

          # Human-readable release mirror from canonical release JSON.
          r = load("release/MODEL_RELEASE_HANDOFF.json")
          release_md = f'''# BUBBLEVERSE MODEL RELEASE HANDOFF

AUTHORIZED Q RANGE: {r["q_access_start"]}–{r["q_access_end"]}
CURRENT Q: {r["current_q"]}
Processed through: {r["processed_through_q"]}

Previous accepted model: {r["accepted_model_before"]}
Candidate: {r["candidate_model"]}
Final accepted model: {r["accepted_model_after"]}

Campaign: {r["test_campaign_id"]}

## MANDATORY TESTS
PASS: {r["mandatory_tests_passed"]} / {r["mandatory_tests_total"]}
FAIL: {r["mandatory_tests_failed"]}
INCONCLUSIVE: {r["mandatory_tests_inconclusive"]}
NOT COMPARABLE: {r["mandatory_tests_not_comparable"]}
BLOCKED: {r["mandatory_tests_blocked"]}
TECHNICAL FAIL: {r["mandatory_tests_technical_fail"]}
INVALID: {r["mandatory_tests_invalid"]}

## GATES
Q ACCESS FIREWALL: {r["q_access_firewall_gate"]}
HIGH-Q CONTAMINATION: {r["high_q_contamination_gate"]}
SCHEMA: {r["model_schema_gate"]}
PROVENANCE: {r["provenance_gate"]}
CONTRADICTIONS: {r["contradiction_gate"]}
REGRESSION: {r["regression_gate"]}
TEST CAMPAIGN: {r["test_campaign_gate"]}
PROMOTION: {r["candidate_promotion_gate"]}
FINAL AUDIT: {r["final_audit_gate"]}

ALL MANDATORY GREEN: {"YES" if r["all_mandatory_green"] else "NO"}
CANDIDATE PROMOTED: {"YES" if r["candidate_promoted"] else "NO"}
NEXT WORD AUTHORIZED: {"YES" if r["next_word_authorized"] else "NO"}
RELEASE STATUS: {r["release_status"]}

SOURCE BUBBLEVERSE COMMIT: `{r["source_bubbleverse_commit"]}`
CANDIDATE COMMIT: `{r["candidate_commit"]}`
MODEL REPOSITORY COMMIT ({r["model_repository_commit_semantics"]}): `{r["model_repository_commit"]}`
REPAIR STATUS: {r.get("repair_status", "NONE")}
'''
          (ROOT / "release/MODEL_RELEASE_HANDOFF.md").write_text(release_md, encoding="utf-8")

          # Current test-plan metadata. Historical prereg/results remain untouched.
          test_plan = '''# BUBBLEVERSE MODEL — TEST PLAN CURRENT

**Campaign:** BV-MODEL-v0.2-CAMPAIGN-0002
**Authorized Q range:** Q001–Q040
**Current Q:** Q040
**Accepted model:** v0.2 / R000002
**Candidate record:** v0.2 — PROMOTED
**Mode:** current-state validation

Historical preregistration and historical results remain preserved under `tests/preregistration/` and `tests/results/`. This file describes the active validator only.

| TEST_ID | Current target | Required |
|---|---|---|
| T-BV-001 | Candidate/accepted identity and current Q boundary | YES |
| T-BV-002 | High-Q contamination firewall | YES |
| T-BV-003 | H0 inference-chain invariant | YES |
| T-BV-004 | Authoritative Q039 provenance preservation | YES |
| T-BV-005 | Q039 technical/scientific separation | YES |
| T-BV-006 | Q039 narrowing + Q040 technical-vs-physical semantics | YES |
| T-BV-007 | Contradiction preservation | YES |
| T-BV-008 | Open-question preservation | YES |
| T-BV-009 | JSON/schema/reference integrity | YES |

## Success rule
All nine current tests must explicitly PASS.

## Q firewall
Current scientific/model state is limited to Q001–Q040. No current-state validation may ingest Q041+ scientific evidence.

## Execution mechanism
`tests/programs/model_campaign.py validate` performs deterministic current-state validation. The permanent public workflow is `.github/workflows/00-bubbleverse-model-start-public.yml`.

## Promotion semantics
This current validator is non-promoting. It does not create a new accepted model, expand the Q boundary, or revise scientific conclusions. Promotion is handled by the controlled model-update pipeline.
'''
          (ROOT / "tests/TEST_PLAN_CURRENT.md").write_text(test_plan, encoding="utf-8")

          test_registry = load("tests/test_registry.json")
          test_registry.update({
              "campaign_id": "BV-MODEL-v0.2-CAMPAIGN-0002",
              "accepted_model_version": "v0.2",
              "candidate_model_version": "v0.2",
              "current_q": "Q040",
              "q_access_start": "Q001",
              "q_access_end": "Q040",
              "mode": "CURRENT_STATE_VALIDATION",
          })
          targets = {
              "T-BV-001": ("Candidate/accepted identity and Q040 boundary",
                           "Candidate and accepted state must agree on Q001-Q040 / CURRENT_Q Q040."),
              "T-BV-002": ("High-Q contamination firewall",
                           "Current scientific candidate/evidence JSON must contain no Q identifier above Q040."),
              "T-BV-003": ("H0 inference-chain invariant",
                           "Three active H0 benchmarks and distinct inference-chain labels must remain intact."),
              "T-BV-004": ("Q039 provenance invariant",
                           "Authoritative Q039 identities and PASS provenance must remain preserved after Q040."),
              "T-BV-005": ("Q039 technical/scientific separation",
                           "Q039 V1-V4 recovery failures must remain non-scientific and superseded."),
              "T-BV-006": ("Q039 narrowing + Q040 failure semantics",
                           "Q039 narrowing must remain conservative and Q040 TECHNICAL_FAIL must not become physical falsification."),
              "T-BV-007": ("Contradiction preservation",
                           "H0 and CamSpec-HiLLiPoP contradictions must remain explicit."),
              "T-BV-008": ("Open-question preservation",
                           "Hubble tension, dark-matter identity and late-acceleration origin remain unresolved where required."),
              "T-BV-009": ("JSON/schema/reference integrity",
                           "Current JSON must parse and registry/layer IDs must remain unique."),
          }
          for item in test_registry.get("tests", []):
              tid = item.get("test_id")
              if tid in targets:
                  item["target_component"], item["why_test_matters"] = targets[tid]
                  item["mandatory_for_current_validation"] = True
                  item["mandatory_for_promotion"] = False
                  item["status"] = "PASS"
          save("tests/test_registry.json", test_registry)

          # Migrate unique handoff details into canonical provenance.
          prov_path = ROOT / "provenance/Q040_PROVENANCE.md"
          provenance = prov_path.read_text(encoding="utf-8")
          if "## Model-integration provenance" not in provenance:
              provenance += '''

## Model-integration provenance

- Integration artifact SHA-256: `1cdb34576665d4b91300243ea72b92eab8ee8a24a122fbf118fcd424d891ffc5`
- Final artifact SHA-256: `450c7a4116eff544d5c8e0f8b209a6ba1f41caa4cb8b89284923d1956b348a62`
- Initial connected-write attempt: `TECHNICAL_BLOCK_403`; infrastructure failure, not scientific failure.
- Q040 was subsequently promoted successfully and the post-promotion consistency repair completed at repository commit `c5ce68196619ebabe0877400e672104be9da665e`.
- One-time installer/repair infrastructure is preserved by Git history rather than retained as active root/workflow clutter.
'''
          prov_path.write_text(provenance, encoding="utf-8")

          # Machine changelog — record missing Q040 and repair history as metadata sync,
          # then record this cleanup as structural/non-scientific.
          registry = load("changelog/model_change_registry.json")
          changes = registry.setdefault("changes", [])
          known = {x.get("change_revision") for x in changes}

          if "R000007" not in known:
              changes.append({
                  "change_revision": "R000007",
                  "date": "2026-09-08T22:08:56+00:00",
                  "status": "Q040_MODEL_PROMOTION_RECORDED_POST_HOC",
                  "accepted_after": "v0.2",
                  "current_q": "Q040",
                  "q_access_start": "Q001",
                  "q_access_end": "Q040",
                  "model_revision": "R000002",
                  "formal_model_version": "v0.2-formalization-1",
                  "historical_scientific_change": True,
                  "scientific_change": False,
                  "metadata_sync": True,
                  "source_bubbleverse_commit": "855a28c58246dbdd52d01cae1f40e0611103d96b",
                  "promotion_commit": "26bfb093bee892ac32b9e1db78c36df3dd43ac3e",
              })

          if "R000008" not in known:
              changes.append({
                  "change_revision": "R000008",
                  "date": "2026-09-09T03:47:45+00:00",
                  "status": "Q040_POST_PROMOTION_CONSISTENCY_REPAIR_RECORDED_POST_HOC",
                  "accepted_after": "v0.2",
                  "current_q": "Q040",
                  "q_access_start": "Q001",
                  "q_access_end": "Q040",
                  "model_revision": "R000002",
                  "scientific_change": False,
                  "metadata_sync": True,
                  "repair_commit": "c5ce68196619ebabe0877400e672104be9da665e",
              })

          if "R000009" not in known:
              changes.append({
                  "change_revision": "R000009",
                  "date": datetime.now(timezone.utc).isoformat(),
                  "status": "REPOSITORY_CLEANUP",
                  "accepted_after": "v0.2",
                  "current_q": "Q040",
                  "q_access_start": "Q001",
                  "q_access_end": "Q040",
                  "model_revision": "R000002",
                  "scientific_change": False,
                  "accepted_state_changed": False,
                  "q_boundary_changed": False,
                  "model_version_changed": False,
                  "cleanup_classes": [
                      "OBSOLETE_WORKFLOW_REMOVAL",
                      "INSTALLER_REMOVAL",
                      "TEMPORARY_FILE_REMOVAL",
                      "STALE_METADATA_REPAIR",
                      "DOCUMENTATION_SYNC",
                      "REFERENCE_REPAIR",
                  ],
              })
          save("changelog/model_change_registry.json", registry)

          changelog_path = ROOT / "changelog/MODEL_CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          if "## Repository cleanup — 2026-09-09" not in changelog:
              changelog += '''

## Repository cleanup — 2026-09-09

- Removed completed Q040 installer and repair infrastructure from the active root/workflow surface after successful validation.
- Removed the stale secondary README and synchronized canonical README/release/test metadata to Q040 / v0.2 / R000002.
- Preserved unique Q040 artifact hashes and technical handoff history in canonical provenance.
- Preserved all accepted snapshots, evidence, historical preregistration and test results.
- Added runtime-clutter ignore rules.
- Scientific change: false.
- Accepted state changed: false.
- Q boundary changed: false.
- Model version changed: false.
'''
          changelog_path.write_text(changelog, encoding="utf-8")

          # Prevent recurring runtime clutter.
          gitignore_path = ROOT / ".gitignore"
          existing = gitignore_path.read_text(encoding="utf-8").splitlines() if gitignore_path.exists() else []
          for rule in ["run-output/", "__pycache__/", "*.py[cod]", ".pytest_cache/", ".mypy_cache/", ".DS_Store"]:
              if rule not in existing:
                  existing.append(rule)
          gitignore_path.write_text("\n".join(x for x in existing if x.strip()) + "\n", encoding="utf-8")

          # Self-delete this one-time workflow.
          if (ROOT / self_path).exists():
              (ROOT / self_path).unlink()

          # JSON parse gate.
          failures = []
          for p in ROOT.rglob("*.json"):
              if ".git" in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append((p.relative_to(ROOT).as_posix(), str(exc)))
          if failures:
              raise SystemExit(f"JSON_PARSE_GATE failed: {failures[:10]}")

          # Immutable/scientific-byte gate.
          after = fingerprint()
          if before != after:
              paths = sorted(set(before) | set(after))
              changed = [p for p in paths if before.get(p) != after.get(p)]
              raise SystemExit(f"PROTECTED_STATE_CHANGED: {changed}")

          # Active broken-reference gate.
          for target in delete_paths:
              needles = {target, Path(target).name}
              hits = []
              for candidate in ROOT.rglob("*"):
                  if not candidate.is_file() or ".git" in candidate.parts:
                      continue
                  rel = candidate.relative_to(ROOT).as_posix()
                  if rel.startswith("provenance/") or rel.startswith("changelog/"):
                      continue
                  try:
                      text = candidate.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  if any(needle in text for needle in needles):
                      hits.append(rel)
              if hits:
                  raise SystemExit(f"BROKEN_REFERENCE_GATE failed for {target}: {hits}")

          assert "Q001–Q040" in (ROOT / "README.md").read_text(encoding="utf-8")
          assert "v0.2" in (ROOT / "README.md").read_text(encoding="utf-8")
          assert "CURRENT Q: Q040" in (ROOT / "release/MODEL_RELEASE_HANDOFF.md").read_text(encoding="utf-8")
          tr = load("tests/test_registry.json")
          assert tr["q_access_end"] == "Q040"
          assert tr["accepted_model_version"] == "v0.2"

          print("AUDIT_AND_STRUCTURAL_CLEANUP=PASS")
          print("SCIENTIFIC_CHANGE=false")
          print("ACCEPTED_STATE_CHANGED=false")
          print("Q_BOUNDARY_CHANGED=false")
          print("MODEL_VERSION_CHANGED=false")
          PY

      - name: Formal model validation
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/formal_model_validate.py

      - name: Current scientific/model validation
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/model_campaign.py validate

      - name: Q040 semantic regression validation
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/q040_model_validate.py

      - name: Public engine full healthcheck
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          workflow = Path(".github/workflows/00-bubbleverse-model-start-public.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ) + "\n"

          script = Path("/tmp/bubbleverse_public_engine.py")
          script.write_text(code, encoding="utf-8")

          env = dict(os.environ)
          env.update({
              "BV_OPERATION": "test",
              "BV_INPUT": "",
              "GITHUB_REPOSITORY": "Morfindien/bubbleverse-model",
          })

          cp = subprocess.run(
              ["python", str(script)],
              cwd=Path.cwd(),
              env=env,
              text=True,
              capture_output=True,
          )
          print(cp.stdout)
          if cp.stderr:
              print(cp.stderr)
          if cp.returncode != 0:
              raise SystemExit(cp.returncode)

          result = json.loads(Path("run-output/result.json").read_text(encoding="utf-8"))
          if (
              result.get("tests_passed") != 20
              or result.get("tests_total") != 20
              or result.get("all_green") is not True
          ):
              raise SystemExit(
                  f"Public healthcheck not 20/20: "
                  f"{result.get('tests_passed')}/{result.get('tests_total')}"
              )

          shutil.rmtree("run-output")
          print("PUBLIC_ENGINE_HEALTHCHECK=20/20 PASS")
          PY

      - name: Git diff scientific firewall
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- \
            accepted \
            versions/accepted \
            evidence \
            model \
            candidate \
            release/MODEL_RELEASE_HANDOFF.json \
            tests/programs \
            tests/preregistration \
            tests/results
          then
            echo "::error::Unexpected protected/scientific diff detected"
            git diff -- \
              accepted \
              versions/accepted \
              evidence \
              model \
              candidate \
              release/MODEL_RELEASE_HANDOFF.json \
              tests/programs \
              tests/preregistration \
              tests/results
            exit 1
          fi

          ALLOWED='^(.gitignore|README.md|release/MODEL_RELEASE_HANDOFF.md|tests/TEST_PLAN_CURRENT.md|tests/test_registry.json|changelog/MODEL_CHANGELOG.md|changelog/model_change_registry.json|provenance/Q040_PROVENANCE.md|.github/workflows/q040-model-update.yml|.github/workflows/q040-model-repair.yml|.github/workflows/repository-cleanup-once.yml|Q040_MODEL_UPDATE_INSTALL.py|Q040_MODEL_UPDATE_MANIFEST.json|Q040_MODEL_UPDATE_REPORT.md|Q040_MODEL_REPAIR.py|Q040_MODEL_REPAIR_REPORT.json|README-updated-final.md)$'

          BAD="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$ALLOWED" || true)"
          if [[ -n "$BAD" ]]; then
            echo "::error::Unexpected cleanup diff paths"
            echo "$BAD"
            exit 1
          fi

          echo "SCIENTIFIC_CHANGE=false"
          echo "ACCEPTED_STATE_CHANGED=false"
          echo "Q_BOUNDARY_CHANGED=false"
          echo "MODEL_VERSION_CHANGED=false"

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Repository cleanup: remove obsolete files and sync metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "CLEANUP_COMMIT=$(git rev-parse HEAD)"

      - name: Cleanup summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Bubbleverse Repository Cleanup"
            echo
            echo "- Mode: CLEAN"
            echo "- Audited baseline: \`c5ce68196619ebabe0877400e672104be9da665e\`"
            echo "- Files scanned: **96**"
            echo "- Safe deletions: **8**"
            echo "- Metadata/document/provenance updates: **7**"
            echo "- Runtime prevention: **.gitignore added**"
            echo "- Scientific change: **false**"
            echo "- Accepted state changed: **false**"
            echo "- Q boundary changed: **false**"
            echo "- Model version changed: **false**"
          } >> "$GITHUB_STEP_SUMMARY"
