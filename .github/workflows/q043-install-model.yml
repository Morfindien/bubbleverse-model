name: "BUBBLEVERSE — INSTALL Q043 MODEL"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Install the reviewed Q043 model, or validate without publishing"
        type: choice
        required: true
        default: install
        options:
          - install
          - validate

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-refs/heads/main
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Morfindien/bubbleverse-model' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify, validate and install Q043
        env:
          INSTALL_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, subprocess, sys, textwrap, unittest

          BASE = '14eacce7a93e4ac780d59b1e86dc0cb9060f38ad'
          PACKAGE = '7ce4ab007cf991922650f466936c1f5da2ffe237'
          BUNDLE_SHA = 'd18c0ad4e3438d86cbec4a137800abf652fe6ade70b88cc61f16bfb6d3f3c459'
          BUNDLE = Path('Q043_model_update.bundle')
          INSTALLER = '.github/workflows/q043-install-model.yml'
          RECEIPT = 'provenance/Q043_REMOTE_INSTALLATION_RECEIPT.json'
          OUT = Path('run-output/q043-install')
          OUT.mkdir(parents=True, exist_ok=True)

          def run(*args, capture=False):
              p = subprocess.run(args, text=True, stdout=subprocess.PIPE if capture else None, check=True)
              return p.stdout.strip() if capture else None

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def remote_head():
              result = run('git', 'ls-remote', 'origin', 'refs/heads/main', capture=True).split()
              require(len(result) == 2, 'Cannot verify remote main')
              return result[0]

          def ancestor(a, b):
              return subprocess.run(['git', 'merge-base', '--is-ancestor', a, b]).returncode == 0

          def changed(a, b):
              return set(run('git', 'diff', '--name-only', a, b, capture=True).splitlines())

          def protected_hashes():
              return {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                      for name in ('accepted','candidate','model','evidence','release','versions','tests')
                      for p in Path(name).rglob('*')
                      if p.is_file() and '__pycache__' not in str(p)}

          def validate():
              before = protected_hashes()
              run(sys.executable, 'tests/programs/model_campaign.py', 'validate')
              run(sys.executable, 'tests/programs/q043_model_validate.py')
              suite = unittest.defaultTestLoader.discover('tests/programs', pattern='test*.py')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              require(result.wasSuccessful() and not result.skipped and result.testsRun == 22,
                      'Regression gate requires all 22 tests, with zero skips')
              workflow = Path('.github/workflows/00-bubbleverse-model-start-public.yml').read_text()
              public_code = textwrap.dedent(workflow.split("          python - <<'PY'\n",1)[1].split('\n          PY\n',1)[0])
              subprocess.run([sys.executable, '-c', public_code], check=True,
                             env={**os.environ, 'BV_OPERATION':'test', 'BV_INPUT':''})
              health = json.loads(Path('run-output/result.json').read_text())
              require(health['all_green'] and health['tests_passed'] == health['tests_total'] == 20,
                      'Public healthcheck gate failed')
              require(before == protected_hashes(), 'Validation changed protected scientific files')
              require(subprocess.run(['git','diff','--quiet']).returncode == 0,
                      'Validation left unstaged tracked changes')
              state = json.loads(Path('accepted/model_state.json').read_text())
              require(state['current_q'] == state['q_access_end'] == 'Q043'
                      and state['accepted_model_version'] == 'v0.5'
                      and state['production_restart_authorized'] is False
                      and state['physical_model_change'] is False, 'Accepted qualification differs')
              return {'regression_tests_passed':22, 'public_healthcheck_passed':20,
                      'campaign_gate':'PASS', 'q043_gate':'PASS', 'protected_state_unchanged':True}

          def main():
              require(os.environ.get('GITHUB_REPOSITORY') == 'Morfindien/bubbleverse-model',
                      'This installer is only for Morfindien/bubbleverse-model')
              require(os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
                      and os.environ.get('GITHUB_REF') == 'refs/heads/main',
                      'Run manually on main')
              mode = os.environ.get('INSTALL_MODE','install')
              require(mode in ('install','validate'), 'Unsupported mode')
              require(run('git','branch','--show-current',capture=True) == 'main', 'Checkout must be main')
              require(not run('git','status','--porcelain',capture=True), 'Checkout is not clean')
              require(BUNDLE.is_file(), 'Upload Q043_model_update.bundle to the repository root first')
              require(hashlib.sha256(BUNDLE.read_bytes()).hexdigest() == BUNDLE_SHA, 'Bundle SHA256 mismatch')
              run('git','bundle','verify',str(BUNDLE))
              run('git','fetch',str(BUNDLE),'q043-model-update:refs/remotes/q043-package/model')
              require(run('git','rev-parse','refs/remotes/q043-package/model',capture=True) == PACKAGE,
                      'Unexpected package commit')
              initial_head = run('git','rev-parse','HEAD',capture=True)
              require(initial_head == remote_head(), 'main moved since checkout; rerun on current main')
              require(ancestor(BASE, initial_head), 'Required baseline is not an ancestor')
              already_current = ancestor(PACKAGE, initial_head)
              guide = Path('Q043_INSTALL_ACTIONS.md')
              if guide.exists():
                  require(hashlib.sha256(guide.read_bytes()).hexdigest() == '618460bfec8ded316408f4df635236e5a3c657d4e57a1c047a2f06b720373d41',
                          'Installation guide bytes differ from the delivered guide')
              allowed = {INSTALLER, str(BUNDLE), str(guide)}
              if already_current:
                  require(changed(PACKAGE,initial_head) <= allowed | {RECEIPT},
                          'Model differs from the reviewed Q043 package; needs a fresh review')
              else:
                  require(changed(BASE,initial_head) <= allowed,
                          'Model baseline changed; only the installer, bundle and verified guide uploads are permitted')
                  run('git','config','user.name','github-actions[bot]')
                  run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
                  run('git','merge','--no-ff','--no-commit',PACKAGE)
                  require(not run('git','diff','--name-only','--diff-filter=U',capture=True), 'Merge conflict')
                  require(not run('git','diff','--name-only',PACKAGE,capture=True).splitlines()
                          or set(run('git','diff','--name-only',PACKAGE,capture=True).splitlines()) <= allowed,
                          'Merged files differ from the reviewed package')
              checks = validate()
              report = {'target_q':'Q043', 'accepted_version':'v0.5', 'model_revision':'R000005',
                        'package_commit':PACKAGE, 'baseline_commit':BASE, 'initial_main_commit':initial_head,
                        'bundle_sha256':BUNDLE_SHA, 'test_results':checks,
                        'production_restart_authorized':False, 'physical_model_change':False,
                        'source_repository_modified':False,
                        'run_id':os.environ.get('GITHUB_RUN_ID'),
                        'run_url':f"https://github.com/Morfindien/bubbleverse-model/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
                        'timestamp_utc':datetime.now(timezone.utc).isoformat()}
              if mode == 'validate':
                  report.update(stop_state='VALIDATED_NOT_PUBLISHED', remote_promotion_verified=False)
              elif already_current:
                  require(remote_head() == initial_head, 'main moved during validation')
                  report.update(stop_state='ALREADY_CURRENT', remote_promotion_verified=True,
                                verified_remote_commit=initial_head)
              else:
                  require(remote_head() == initial_head, 'main moved during validation; no push attempted')
                  run('git','commit','-m','Install validated Q043 model v0.5 with reviewed Git history')
                  promotion = run('git','rev-parse','HEAD',capture=True)
                  run('git','push','origin','HEAD:refs/heads/main')
                  require(remote_head() == promotion, 'Remote promotion commit could not be verified')
                  report.update(stop_state='PROMOTED', remote_promotion_verified=True,
                                promotion_commit=promotion)
                  receipt = Path(RECEIPT)
                  receipt.parent.mkdir(parents=True, exist_ok=True)
                  receipt.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
                  run('git','add',RECEIPT)
                  run('git','commit','-m','Record verified remote Q043 installation receipt')
                  run('git','push','origin','HEAD:refs/heads/main')
                  final = run('git','rev-parse','HEAD',capture=True)
                  require(remote_head() == final, 'Remote receipt commit could not be verified')
                  report['verified_remote_commit'] = final
              (OUT/'installation-result.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
              with summary.open('a') as f:
                  f.write(f"\nQ043 installer: **{report['stop_state']}**. 22/22 regressions; 20/20 public healthcheck.\n")
                  f.write('No physical model change. Numerical production remains unauthorized.\n')
              print(json.dumps(report,indent=2))

          try:
              main()
          except Exception as exc:
              (OUT/'installation-error.json').write_text(json.dumps({'stop_state':'INSTALLATION_BLOCKED',
                  'error':str(exc), 'note':'Inspect remote main: a push may have succeeded before a later receipt/verification failure.'},indent=2)+'\n')
              raise
          PY
      - name: Preserve installation result and healthcheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q043-model-installation-${{ github.run_id }}
          path: run-output/
          if-no-files-found: warn
