name: "🧬 BUBBLEVERSE MODEL — Q040 UPDATE"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-q040-${{ github.ref }}
  cancel-in-progress: false

jobs:
  q040-model-update:
    name: "Q040 → Model v0.2"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout bubbleverse-model
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Q040 preflight
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Q040 model promotion must run from main. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          test -f Q040_MODEL_UPDATE_INSTALL.py
          test -f Q040_MODEL_UPDATE_MANIFEST.json
          test -f Q040_MODEL_UPDATE_REPORT.md
          test -f accepted/model_state.json

          python - <<'PY'
          from pathlib import Path
          source = Path("Q040_MODEL_UPDATE_INSTALL.py").read_text(encoding="utf-8")
          compile(source, "Q040_MODEL_UPDATE_INSTALL.py", "exec")
          print("INSTALLER_SYNTAX_GATE=PASS")
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path("accepted/model_state.json").read_text(encoding="utf-8")
          )

          expected = {
              "current_q": "Q039",
              "q_access_end": "Q039",
              "accepted_model_version": "v0.1",
              "model_revision": "R000001",
          }

          bad = {
              key: {"expected": value, "actual": state.get(key)}
              for key, value in expected.items()
              if state.get(key) != value
          }

          if bad:
              raise SystemExit(
                  "Q040 preflight failed. Accepted model is not the required "
                  f"Q039/v0.1/R000001 state: {bad}"
              )

          print("Q040_SEQUENCE_GATE=PASS")
          print("AUTHORIZED_TRANSITION=Q039->Q040")
          PY

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Repository is not clean before Q040 execution."
            git status --short
            exit 1
          fi

      - name: Verify locked Bubbleverse Q040 source commit
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO="https://github.com/Morfindien/Bubbleverse.git"
          SOURCE_SHA="855a28c58246dbdd52d01cae1f40e0611103d96b"
          SOURCE_WORKFLOW=".github/workflows/q040-defensive-rqmc-v4.yml"
          SOURCE_DIR="${RUNNER_TEMP}/bubbleverse-q040-source"

          rm -rf "${SOURCE_DIR}"
          git init -q "${SOURCE_DIR}"
          git -C "${SOURCE_DIR}" fetch -q --depth=1 "${SOURCE_REPO}" "${SOURCE_SHA}"

          ACTUAL_SHA="$(git -C "${SOURCE_DIR}" rev-parse FETCH_HEAD)"
          if [[ "${ACTUAL_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "::error::SOURCE_COMMIT_GATE failed: ${ACTUAL_SHA}"
            exit 1
          fi

          if ! git -C "${SOURCE_DIR}" cat-file -e \
            "${SOURCE_SHA}:${SOURCE_WORKFLOW}"; then
            echo "::error::Locked Q040 source workflow is missing at ${SOURCE_SHA}."
            exit 1
          fi

          echo "SOURCE_COMMIT_GATE=PASS"
          echo "SOURCE_WORKFLOW_GATE=PASS"

      - name: Optional Word hash gate
        id: word
        shell: bash
        run: |
          set -euo pipefail

          WORD_FILE="${GITHUB_WORKSPACE}/bubblevers 0.40m.docx"
          EXPECTED_SHA="d389095fea2bd65ca5424a77cf22a4240581f1966eff3575ddabddfd0dd54397"

          if [[ -f "${WORD_FILE}" ]]; then
            ACTUAL_SHA="$(sha256sum "${WORD_FILE}" | awk '{print $1}')"

            if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
              echo "::error::WORD_HASH_GATE failed."
              echo "Expected: ${EXPECTED_SHA}"
              echo "Actual:   ${ACTUAL_SHA}"
              exit 1
            fi

            echo "WORD_HASH_GATE=PASS"
            echo "manuscript_present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "WORD_HASH_GATE=SKIPPED_FILE_NOT_IN_REPOSITORY"
            echo "The installer remains locked to the registered Q040 manuscript SHA."
            echo "manuscript_present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Execute Q040 candidate gates and atomic promotion
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.word.outputs.manuscript_present }}" == "true" ]]; then
            python Q040_MODEL_UPDATE_INSTALL.py \
              --repo . \
              --manuscript "${GITHUB_WORKSPACE}/bubblevers 0.40m.docx"
          else
            python Q040_MODEL_UPDATE_INSTALL.py \
              --repo .
          fi

      - name: Final Q040 validation
        shell: bash
        run: |
          set -euo pipefail

          python tests/programs/q040_model_validate.py

          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path("accepted/model_state.json").read_text(encoding="utf-8")
          )

          expected = {
              "current_q": "Q040",
              "q_access_end": "Q040",
              "accepted_model_version": "v0.2",
              "model_revision": "R000002",
          }

          bad = {
              key: {"expected": value, "actual": state.get(key)}
              for key, value in expected.items()
              if state.get(key) != value
          }

          if bad:
              raise SystemExit(f"FINAL_STATE_GATE failed: {bad}")

          print("FINAL_STATE_GATE=PASS")
          print("Q040_PROMOTED=TRUE")
          print("NEXT_Q_AUTHORIZED=TRUE")
          PY

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Tracked files changed after the installer's final commit."
            git status --short
            exit 1
          fi

      - name: Push validated Q040 promotion
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          git push origin "HEAD:${CURRENT_BRANCH}"

          echo "REPOSITORY_WRITE_GATE=PASS"
          echo "Q040_PROMOTION_PUSH=PASS"

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Bubbleverse Model — Q040"
            echo
            echo "- Target: \`Q040\`"
            echo "- Required predecessor: \`Q039 / v0.1 / R000001\`"
            echo "- Intended promoted model: \`v0.2 / R000002\`"
            echo "- Source commit: \`855a28c58246dbdd52d01cae1f40e0611103d96b\`"
            echo "- Source workflow: \`.github/workflows/q040-defensive-rqmc-v4.yml\`"
            echo "- Scientific classification: \`INCONCLUSIVE / TECHNICAL_FAIL\`"
            echo "- Physical falsification: \`false\`"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ -f Q040_INSTALL_REPORT.json ]]; then
            {
              echo "## Install report"
              echo
              echo '```json'
              cat Q040_INSTALL_REPORT.json
              echo
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Result"
              echo
              echo "No \`Q040_INSTALL_REPORT.json\` was produced."
              echo "The update did not reach successful final promotion."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
