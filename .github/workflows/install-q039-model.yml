      - name: Commit and push installed model
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "bubbleverse-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Bootstrap Bubbleverse model through Q039"
          git push origin "HEAD:${GITHUB_REF_NAME}"

