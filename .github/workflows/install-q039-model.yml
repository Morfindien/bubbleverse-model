name: "🏗️ BUBBLEVERSE MODEL — INSTALL Q039"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-bootstrap-q039
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Bubbleverse model repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify bootstrap target
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "Morfindien/Bubbleverse-model" || {
            echo "ERROR: This installer is locked to Morfindien/Bubbleverse-model"
            exit 1
          }

