      - name: Verify installed model identity
        shell: bash
        run: |
          set -euo pipefail
          test -f candidate/candidate_state.json
          test -f tests/programs/model_campaign.py
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("candidate/candidate_state.json").read_text())
          assert s["q_access_start"] == "Q001"
          assert s["q_access_end"] == "Q039"
          assert s["current_q"] == "Q039"
          print("MODEL IDENTITY GATE: PASS")
          PY

      - name: Run preregistered Q039 model campaign
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/model_campaign.py test

      - name: Final release gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("release/MODEL_RELEASE_HANDOFF.json").read_text())
          assert r["q_access_start"] == "Q001"
          assert r["q_access_end"] == "Q039"
          assert r["current_q"] == "Q039"
          assert r["mandatory_tests_passed"] == 9
          assert r["mandatory_tests_failed"] == 0
          assert r["all_mandatory_green"] is True
          assert r["candidate_promoted"] is True
          assert r["next_word_authorized"] is True
          assert r["release_status"] == "ALL_GREEN"
          print("FINAL RELEASE GATE: PASS")
          print("MANDATORY TESTS: 9/9 PASS")
          print("CANDIDATE PROMOTED: YES")
          print("NEXT WORD AUTHORIZED: YES")
          PY

      - name: Commit and push model state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bubbleverse-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: this workflow never creates, edits or deletes any .github/workflows file.
          git add README.md BOOTSTRAP_MANIFEST.md accepted candidate evidence provenance changelog versions tests release bubbleverse_model_program_registry.json

          if git diff --cached --quiet; then
            echo "Model already matches the green Q039 state. Nothing to push."
            exit 0
          fi

          git commit -m "Bootstrap and validate Bubbleverse model through Q039"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Complete
        shell: bash
        run: |
          echo "BUBBLEVERSE MODEL Q039: ALL GREEN"
          echo "The permanent start workflow remains installed."
