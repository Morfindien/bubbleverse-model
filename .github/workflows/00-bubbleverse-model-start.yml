name: "🧪 BUBBLEVERSE MODEL — START"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-q039
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify target and hard Q boundary
        shell: bash
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "Repository: $GITHUB_REPOSITORY"
          test "$repo" = "morfindien/bubbleverse-model" || {
            echo "ERROR: Workflow is locked to Morfindien/bubbleverse-model"
            exit 1
          }
          echo "Q_ACCESS_START=Q001"
          echo "Q_ACCESS_END=Q039"
          echo "CURRENT_Q=Q039"

