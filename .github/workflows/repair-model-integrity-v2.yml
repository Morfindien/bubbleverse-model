name: "🛠️ BUBBLEVERSE MODEL — REPAIR INTEGRITY"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair model integrity
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations
          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          ACCEPTED_VERSION = "v0.1"

          def load(path):
              return json.loads((ROOT / path).read_text(encoding="utf-8"))

          def dump(path, obj):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          # SELF-016 — accepted path isolation.
          accepted = load("accepted/model_state.json")
          accepted["layers"] = {
              "constraints": "accepted/constraints.json",
              "contradictions": "accepted/contradictions.json",
              "mechanisms": "accepted/mechanisms.json",
              "observations": "accepted/observations.json",
              "predictions": "accepted/predictions.json",
              "robustness": "accepted/robustness.json",
          }
          accepted["status"] = "ACCEPTED"
          accepted["accepted_model_version"] = ACCEPTED_VERSION
          accepted["candidate_model_version"] = None
          accepted.pop("promotion_status", None)
          dump("accepted/model_state.json", accepted)

          # One-time structural correction of the frozen v0.1 snapshot.
          dump(f"versions/accepted/{ACCEPTED_VERSION}/model_state.json", accepted)

          # SELF-017 — explicit promotion state.
          candidate = load("candidate/candidate_state.json")
          candidate["accepted_model_version"] = ACCEPTED_VERSION
          candidate["promotion_status"] = f"PROMOTED_TO_{ACCEPTED_VERSION}"
          candidate["status"] = "CANDIDATE_PROMOTED"
          dump("candidate/candidate_state.json", candidate)

          # SELF-018 — real reachable repository provenance.
          head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if not re.fullmatch(r"[0-9a-fA-F]{40}", head_sha):
              raise RuntimeError(f"Invalid HEAD SHA: {head_sha!r}")

          release = load("release/MODEL_RELEASE_HANDOFF.json")
          release["model_repository_commit"] = head_sha
          release["model_repository_commit_semantics"] = "campaign_or_repair_input_commit"
          dump("release/MODEL_RELEASE_HANDOFF.json", release)

          md_path = ROOT / "release/MODEL_RELEASE_HANDOFF.md"
          if md_path.exists():
              md = md_path.read_text(encoding="utf-8")
              line = f"MODEL REPOSITORY COMMIT: {head_sha}  "
              if re.search(r"^MODEL REPOSITORY COMMIT:.*$", md, flags=re.M):
                  md = re.sub(r"^MODEL REPOSITORY COMMIT:.*$", line, md, flags=re.M)
              else:
                  md = md.rstrip() + "\n\n" + line + "\n"
              md_path.write_text(md, encoding="utf-8")

          # Future-proof model_campaign.py so later campaign runs do not
          # regenerate the three integrity defects.
          campaign_path = ROOT / "tests/programs/model_campaign.py"
          text = campaign_path.read_text(encoding="utf-8")

          if "import argparse, json, re, shutil, subprocess" not in text:
              text = text.replace(
                  "import argparse, json, re, shutil",
                  "import argparse, json, re, shutil, subprocess",
                  1,
              )

          old_promote = "\n".join([
              '    cand=load("candidate/candidate_state.json")',
              '    accepted=dict(cand)',
              '    accepted["status"]="ACCEPTED"',
              '    accepted["accepted_model_version"]="v0.1"',
              '    accepted["candidate_model_version"]=None',
              '    accepted["accepted_at"]="GITHUB_ACTIONS_CAMPAIGN"',
              '    dump("accepted/model_state.json",accepted)',
              '    for name in ["observations","constraints","mechanisms","predictions","contradictions","robustness"]:',
              '        shutil.copy2(ROOT/f"candidate/{name}.json",ROOT/f"accepted/{name}.json")',
              '',
          ])
          new_promote = "\n".join([
              '    cand=load("candidate/candidate_state.json")',
              '    cand["accepted_model_version"]="v0.1"',
              '    cand["promotion_status"]="PROMOTED_TO_v0.1"',
              '    cand["status"]="CANDIDATE_PROMOTED"',
              '    dump("candidate/candidate_state.json",cand)',
              '',
              '    accepted=dict(cand)',
              '    accepted["status"]="ACCEPTED"',
              '    accepted["accepted_model_version"]="v0.1"',
              '    accepted["candidate_model_version"]=None',
              '    accepted["accepted_at"]="GITHUB_ACTIONS_CAMPAIGN"',
              '    accepted.pop("promotion_status",None)',
              '    accepted["layers"]={',
              '        "constraints":"accepted/constraints.json",',
              '        "contradictions":"accepted/contradictions.json",',
              '        "mechanisms":"accepted/mechanisms.json",',
              '        "observations":"accepted/observations.json",',
              '        "predictions":"accepted/predictions.json",',
              '        "robustness":"accepted/robustness.json"',
              '    }',
              '    for name in ["observations","constraints","mechanisms","predictions","contradictions","robustness"]:',
              '        shutil.copy2(ROOT/f"candidate/{name}.json",ROOT/f"accepted/{name}.json")',
              '    dump("accepted/model_state.json",accepted)',
              '',
          ])

          if old_promote in text:
              text = text.replace(old_promote, new_promote, 1)
          elif 'accepted["layers"]={' not in text:
              raise RuntimeError("Could not locate promotion block for safe patching.")

          release_anchor = '    r=load("release/MODEL_RELEASE_HANDOFF.json")\n    r.update({\n'
          release_replacement = "\n".join([
              '    r=load("release/MODEL_RELEASE_HANDOFF.json")',
              '    try:',
              '        model_commit=subprocess.check_output(',
              '            ["git","rev-parse","HEAD"],cwd=ROOT,text=True,stderr=subprocess.DEVNULL',
              '        ).strip()',
              '        if not re.fullmatch(r"[0-9a-fA-F]{40}",model_commit):',
              '            raise ValueError("git rev-parse did not return a 40-hex SHA")',
              '    except Exception:',
              '        model_commit=r.get("model_repository_commit")',
              '    r.update({',
              '',
          ])
          if "model_commit=subprocess.check_output" not in text:
              if release_anchor not in text:
                  raise RuntimeError("Could not locate release provenance block.")
              text = text.replace(release_anchor, release_replacement, 1)

          placeholder_line = (
              '      "model_repository_commit":"SEE_REPOSITORY_COMMIT_CONTAINING_THIS_HANDOFF" '
              'if allg else r.get("model_repository_commit"),\n'
          )
          correct_line = (
              '      "model_repository_commit":model_commit if allg '
              'else r.get("model_repository_commit"),\n'
          )

          if placeholder_line in text:
              text = text.replace(placeholder_line, correct_line, 1)
          elif '"model_repository_commit":model_commit if allg' not in text:
              target = '      "release_status":"ALL_GREEN" if allg else "BLOCKED",\n'
              if target not in text:
                  raise RuntimeError("Could not locate release_status for provenance patch.")
              text = text.replace(target, target + correct_line, 1)

          campaign_path.write_text(text, encoding="utf-8")

          changelog = ROOT / "changelog/MODEL_CHANGELOG.md"
          entry = "\n".join([
              "## R000003 — model integrity repair",
              "- Corrected accepted layer paths from mutable candidate/ paths to accepted/ paths.",
              "- Added explicit candidate promotion state for v0.1.",
              "- Replaced placeholder model-repository provenance with a real reachable Git commit.",
              "- Patched campaign promotion logic so these integrity defects are not regenerated.",
              "- Scientific claims, Q boundary, evidence registry, constraints, mechanisms and predictions unchanged.",
              "",
          ])
          existing = changelog.read_text(encoding="utf-8") if changelog.exists() else ""
          if "## R000003 — model integrity repair" not in existing:
              changelog.parent.mkdir(parents=True, exist_ok=True)
              changelog.write_text(existing.rstrip() + "\n\n" + entry, encoding="utf-8")

          print("Integrity repair applied.")
          print("Recorded repository provenance:", head_sha)
          PY

      - name: Validate repaired campaign code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/programs/model_campaign.py
          python tests/programs/model_campaign.py validate

      - name: Run repaired integrity gates
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()

          def load(p):
              return json.loads((ROOT / p).read_text(encoding="utf-8"))

          accepted = load("accepted/model_state.json")
          candidate = load("candidate/candidate_state.json")
          release = load("release/MODEL_RELEASE_HANDOFF.json")
          version = release["accepted_model_after"]

          active = ROOT / "accepted"
          frozen = ROOT / "versions/accepted" / version
          compared = 0
          for p in sorted(active.iterdir()):
              if not p.is_file():
                  continue
              q = frozen / p.name
              assert q.exists(), f"Snapshot missing {p.name}"
              assert hashlib.sha256(p.read_bytes()).digest() == hashlib.sha256(q.read_bytes()).digest(), \
                  f"Snapshot mismatch: {p.name}"
              compared += 1
          assert compared > 0
          print(f"SELF-015 PASS — {compared} accepted files match frozen snapshot")

          for layer, path in accepted["layers"].items():
              assert path.startswith("accepted/"), f"{layer} escapes accepted/: {path}"
              assert (ROOT / path).exists(), f"{layer} target missing: {path}"
          print("SELF-016 PASS — accepted layers are isolated")

          assert accepted["status"] == "ACCEPTED"
          assert accepted["accepted_model_version"] == version
          assert candidate["candidate_model_version"] == release["candidate_model"]
          assert candidate["promotion_status"] in {
              "PROMOTED",
              "PROMOTED_TO_ACCEPTED",
              f"PROMOTED_TO_{version}",
          }
          print("SELF-017 PASS — promotion state is consistent")

          sha = str(release["model_repository_commit"]).strip()
          assert re.fullmatch(r"[0-9a-fA-F]{40}", sha), sha
          subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)
          print(f"SELF-018 PASS — real reachable commit {sha}")
          PY

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bubbleverse-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            accepted/model_state.json \
            versions/accepted/v0.1/model_state.json \
            candidate/candidate_state.json \
            release/MODEL_RELEASE_HANDOFF.json \
            release/MODEL_RELEASE_HANDOFF.md \
            tests/programs/model_campaign.py \
            changelog/MODEL_CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No integrity changes remain to commit."
            exit 0
          fi

          git commit -m "Repair Bubbleverse model integrity"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Repair complete
        shell: bash
        run: |
          echo "MODEL INTEGRITY REPAIR COMPLETE"
          echo "Next: run 🧪 BUBBLEVERSE MODEL — START with operation=test"
