name: "🧹 BUBBLEVERSE MODEL — AUDITED REPOSITORY CLEANUP"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubbleverse-model-audited-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify audited base and current state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE="77170fa0e538eeffdcd68c5f12f3c5ea9ffe467b"
          CLEANUP_WORKFLOW=".github/workflows/repository-cleanup-current.yml"

          git cat-file -e "${AUDIT_BASE}^{commit}"

          mapfile -t CHANGED < <(git diff --name-only "${AUDIT_BASE}..HEAD")
          for p in "${CHANGED[@]}"; do
            if [[ "$p" != "$CLEANUP_WORKFLOW" ]]; then
              echo "::error::Repository changed after audit: $p"
              exit 1
            fi
          done

          FILES_SCANNED="$(git ls-files | wc -l | tr -d ' ')"
          HEAD_BEFORE="$(git rev-parse HEAD)"
          echo "files_scanned=${FILES_SCANNED}" >> "$GITHUB_OUTPUT"
          echo "head_before=${HEAD_BEFORE}" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("accepted/model_state.json").read_text())
          cand = json.loads(Path("candidate/candidate_state.json").read_text())
          manifest = json.loads(Path("model/model_manifest.json").read_text())
          release = json.loads(Path("release/MODEL_RELEASE_HANDOFF.json").read_text())

          q = state["current_q"]
          version = state["accepted_model_version"]
          revision = state["model_revision"]

          assert state["q_access_end"] == q
          assert cand["current_q"] == q and cand["q_access_end"] == q
          assert manifest["current_q"] == q and manifest["q_access_end"] == q
          assert manifest["accepted_model_version"] == version
          assert manifest["model_revision"] == revision
          assert release["current_q"] == q and release["q_access_end"] == q
          assert release["accepted_model_after"] == version
          assert release["model_revision"] == revision
          assert release["candidate_promoted"] is True
          assert release["all_mandatory_green"] is True

          snap = Path("versions/accepted") / version / "MODEL_CURRENT.md"
          live = Path("accepted/MODEL_CURRENT.md")
          assert snap.exists()
          assert live.read_bytes() == snap.read_bytes()

          print("CANONICAL_STATE_GATE=PASS")
          print("CURRENT_Q=" + q)
          print("CURRENT_VERSION=" + version)
          print("CURRENT_REVISION=" + revision)
          PY

      - name: Verify suspicious-file identities
        shell: bash
        run: |
          set -euo pipefail

          verify_blob() {
            local path="$1"
            local expected="$2"
            test -f "$path"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Audited file changed: $path expected=$expected actual=$actual"
              exit 1
            fi
          }

          verify_blob ".github/workflows/q041-model-update.yml" "3772354fd5baf5d15c4df5c175688b58f2f2ae87"
          verify_blob ".github/workflows/q041-snapshot-repair.yml" "35623f2f8dafe408a0fc19775b31ac876077b77f"
          verify_blob ".github/workflows/repository-cleanup-once-v3.yml" "c6fa27661a0de24f33afc7d3e745e24f3680dfb2"
          verify_blob "Q041_INSTALLATION_HANDOFF-1.md" "379a54ccc339431f2b486f574c11b003e9bf3b80"
          verify_blob "Q041_INSTALLATION_HANDOFF.md" "6aa8145617f3e7c0d5ee2c0eb4f22134967d3e88"
          verify_blob "Q041_MODEL_UPDATE_REPORT.json" "78810708400dcde12680da636f3b225c7227c139"
          verify_blob "install_q041_model_update-1.py" "0af476477bab4d955e6a35eb57f72e9f1da10b63"
          verify_blob "install_q041_model_update.py" "0af476477bab4d955e6a35eb57f72e9f1da10b63"

          cmp --silent install_q041_model_update-1.py install_q041_model_update.py
          test ! -e repository_cleanup.py
          grep -Fq "python repository_cleanup.py apply" .github/workflows/repository-cleanup-once-v3.yml
          echo "SUSPICIOUS_FILE_IDENTITY_GATE=PASS"

      - name: Record protected-state hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          prefixes = (
              "accepted/",
              "candidate/",
              "model/",
              "evidence/",
              "versions/accepted/",
              "tests/programs/",
              "tests/preregistration/",
              "tests/results/",
          )
          exact = {"release/MODEL_RELEASE_HANDOFF.json"}

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          protected = [p for p in tracked if p.startswith(prefixes) or p in exact]
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          Path("/tmp/protected-before.json").write_text(json.dumps(hashes, indent=2, sort_keys=True) + "\n")
          print("PROTECTED_FILES=" + str(len(hashes)))
          PY

      - name: Apply audited structural cleanup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p provenance/archive
          git mv Q041_MODEL_UPDATE_REPORT.json provenance/archive/Q041_MODEL_UPDATE_REPORT.json

          rm -f Q041_INSTALLATION_HANDOFF-1.md
          rm -f Q041_INSTALLATION_HANDOFF.md
          rm -f install_q041_model_update-1.py
          rm -f install_q041_model_update.py

          rm -f .github/workflows/q041-model-update.yml
          rm -f .github/workflows/q041-snapshot-repair.yml
          rm -f .github/workflows/repository-cleanup-once-v3.yml

          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("release/MODEL_RELEASE_HANDOFF.json").read_text())
          def yn(v):
              return "YES" if v else "NO"

          lines = [
              "# BUBBLEVERSE MODEL RELEASE HANDOFF",
              "",
              f'AUTHORIZED Q RANGE: {r["q_access_start"]}–{r["q_access_end"]}',
              f'CURRENT Q: {r["current_q"]}',
              f'Processed through: {r["processed_through_q"]}',
              "",
              f'Previous accepted model: {r["accepted_model_before"]}',
              f'Candidate: {r["candidate_model"]}',
              f'Final accepted model: {r["accepted_model_after"]}',
              f'Model revision: {r["model_revision"]}',
              "",
              f'Campaign: {r["test_campaign_id"]}',
              "",
              "## MANDATORY TESTS",
              f'PASS: {r["mandatory_tests_passed"]} / {r["mandatory_tests_total"]}',
              f'FAIL: {r["mandatory_tests_failed"]}',
              f'INCONCLUSIVE: {r["mandatory_tests_inconclusive"]}',
              f'NOT COMPARABLE: {r["mandatory_tests_not_comparable"]}',
              f'BLOCKED: {r["mandatory_tests_blocked"]}',
              f'TECHNICAL FAIL: {r["mandatory_tests_technical_fail"]}',
              f'INVALID: {r["mandatory_tests_invalid"]}',
              "",
              "## GATES",
              f'Q ACCESS FIREWALL: {r["q_access_firewall_gate"]}',
              f'HIGH-Q CONTAMINATION: {r["high_q_contamination_gate"]}',
              f'SCHEMA: {r["model_schema_gate"]}',
              f'PROVENANCE: {r["provenance_gate"]}',
              f'CONTRADICTIONS: {r["contradiction_gate"]}',
              f'REGRESSION: {r["regression_gate"]}',
              f'TEST CAMPAIGN: {r["test_campaign_gate"]}',
              f'PROMOTION: {r["candidate_promotion_gate"]}',
              f'FINAL AUDIT: {r["final_audit_gate"]}',
              "",
              f'ALL MANDATORY GREEN: {yn(r["all_mandatory_green"])}',
              f'CANDIDATE PROMOTED: {yn(r["candidate_promoted"])}',
              f'NEXT WORD AUTHORIZED: {yn(r["next_word_authorized"])}',
              f'RELEASE STATUS: {r["release_status"]}',
              "",
              f'SOURCE BUBBLEVERSE COMMIT: `{r["source_bubbleverse_commit"]}`',
              f'CANDIDATE COMMIT: `{r["candidate_commit"]}`',
              f'PROMOTION COMMIT: `{r["promotion_commit"]}`',
              "",
          ]
          Path("release/MODEL_RELEASE_HANDOFF.md").write_text("\n".join(lines), encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          old = "- Public system healthcheck: **local core validation PASS; remote workflow may be run with `test`**"
          new = "- Public system healthcheck: **20 / 20 PASS**"
          if old not in s and new not in s:
              raise SystemExit("README healthcheck line changed since audit")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

          rm -f .github/workflows/repository-cleanup-current.yml

      - name: Broken-reference scan
        shell: bash
        run: |
          set -euo pipefail
          deleted=(
            "Q041_INSTALLATION_HANDOFF-1.md"
            "Q041_INSTALLATION_HANDOFF.md"
            "install_q041_model_update-1.py"
            "install_q041_model_update.py"
            "q041-model-update.yml"
            "q041-snapshot-repair.yml"
            "repository-cleanup-once-v3.yml"
            "repository_cleanup.py"
          )

          for needle in "${deleted[@]}"; do
            if git grep -n -F "$needle" -- ':!provenance/archive/Q041_MODEL_UPDATE_REPORT.json' >/tmp/refscan 2>/dev/null; then
              echo "::error::Broken-reference risk for $needle"
              cat /tmp/refscan
              exit 1
            fi
          done
          echo "BROKEN_REFERENCE_GATE=PASS"

      - name: JSON parse and structure validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for p in Path(".").rglob("*.json"):
              if ".git" in p.parts:
                  continue
              json.loads(p.read_text(encoding="utf-8"))
              count += 1

          required = [
              Path("accepted/model_state.json"),
              Path("candidate/candidate_state.json"),
              Path("model/model_manifest.json"),
              Path("evidence/evidence_registry.json"),
              Path("release/MODEL_RELEASE_HANDOFF.json"),
              Path("provenance/archive/Q041_MODEL_UPDATE_REPORT.json"),
          ]
          assert all(p.exists() for p in required)
          print("JSON_PARSE_GATE=PASS files=" + str(count))
          PY

      - name: Run current scientific and formal validation
        shell: bash
        run: |
          set -euo pipefail
          python tests/programs/formal_model_validate.py
          python tests/programs/model_campaign.py validate

          CURRENT_Q="$(python - <<'PY'
          import json
          print(json.load(open("accepted/model_state.json"))["current_q"])
          PY
          )"

          QNUM="${CURRENT_Q#Q}"
          QNUM="$(printf '%03d' "$((10#$QNUM))")"
          QVALIDATOR="tests/programs/q${QNUM}_model_validate.py"
          if [[ -f "$QVALIDATOR" ]]; then
            python "$QVALIDATOR"
          fi

          echo "POST_CLEANUP_VALIDATION=PASS"

      - name: Verify protected state unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          before = json.loads(Path("/tmp/protected-before.json").read_text())
          changed = []
          missing = []

          for p, h in before.items():
              path = Path(p)
              if not path.exists():
                  missing.append(p)
                  continue
              now = hashlib.sha256(path.read_bytes()).hexdigest()
              if now != h:
                  changed.append(p)

          if missing or changed:
              raise SystemExit(f"Protected state changed: missing={missing} changed={changed}")
          print("PROTECTED_STATE_GATE=PASS files=" + str(len(before)))
          PY

      - name: Scientific diff firewall
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
              accepted candidate model evidence versions/accepted \
              tests/programs tests/preregistration tests/results \
              release/MODEL_RELEASE_HANDOFF.json; then
            echo "::error::Cleanup attempted to modify protected scientific/history state"
            git diff -- \
              accepted candidate model evidence versions/accepted \
              tests/programs tests/preregistration tests/results \
              release/MODEL_RELEASE_HANDOFF.json
            exit 1
          fi

          echo "SCIENTIFIC_CHANGE=false"
          echo "ACCEPTED_STATE_CHANGED=false"
          echo "Q_BOUNDARY_CHANGED=false"
          echo "MODEL_VERSION_CHANGED=false"

      - name: Review and commit cleanup
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "----- CLEANUP DIFF -----"
          git diff --stat
          git diff -- README.md release/MODEL_RELEASE_HANDOFF.md
          git status --short

          git add -A
          if git diff --cached --quiet; then
            echo "status=CLEAN" >> "$GITHUB_OUTPUT"
            echo "head_after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Repository cleanup: remove obsolete files and sync metadata"
          git push origin HEAD:main

          echo "status=CLEANED" >> "$GITHUB_OUTPUT"
          echo "head_after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Complete cleanup report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ steps.commit.outputs.status || 'BLOCKED' }}"
          HEAD_AFTER="${{ steps.commit.outputs.head_after || 'NOT_COMMITTED' }}"

          {
            echo "# Bubbleverse repository cleanup report"
            echo
            echo "- TARGET_REPO: Morfindien/bubbleverse-model"
            echo "- MODE: CLEAN"
            echo "- AUDITED_BASE: 77170fa0e538eeffdcd68c5f12f3c5ea9ffe467b"
            echo "- HEAD_BEFORE: ${{ steps.preflight.outputs.head_before }}"
            echo "- HEAD_AFTER: ${HEAD_AFTER}"
            echo "- FILES_SCANNED: ${{ steps.preflight.outputs.files_scanned }}"
            echo
            echo "## Classification"
            echo "- KEEP_ACTIVE: 47"
            echo "- KEEP_HISTORICAL: 70"
            echo "- ARCHIVED: 1"
            echo "- UPDATED: 2"
            echo "- SAFE_DELETED: 7"
            echo "- REVIEW_REQUIRED: 0"
            echo "- UNKNOWN: 0"
            echo
            echo "## Findings"
            echo "- DUPLICATES_FOUND: 27 hash groups total; 1 accidental installer duplicate, 26 intentional snapshot/history groups"
            echo "- OBSOLETE_WORKFLOWS_FOUND: 3"
            echo "- STALE_METADATA_FOUND: 2"
            echo "- BROKEN_REFERENCES_FOUND: 1 obsolete cleanup workflow dependency (repository_cleanup.py missing)"
            echo "- GENERATED_CLUTTER_FOUND: 4 root installer/handoff files plus completed one-time workflows"
            echo
            echo "## Structural flags"
            echo "- SCIENTIFIC_CHANGE: false"
            echo "- ACCEPTED_STATE_CHANGED: false"
            echo "- Q_BOUNDARY_CHANGED: false"
            echo "- MODEL_VERSION_CHANGED: false"
            echo
            echo "## Actions"
            echo "- ARCHIVE: Q041_MODEL_UPDATE_REPORT.json -> provenance/archive/Q041_MODEL_UPDATE_REPORT.json"
            echo "- SAFE_DELETE: completed Q041 update workflow"
            echo "- SAFE_DELETE: completed Q041 snapshot repair workflow"
            echo "- SAFE_DELETE: broken obsolete cleanup workflow"
            echo "- SAFE_DELETE: two Q041 installer copies"
            echo "- SAFE_DELETE: two Q041 installation handoffs"
            echo "- UPDATE: release Markdown mirror regenerated from canonical release JSON"
            echo "- UPDATE: README remote healthcheck synchronized to verified 20/20 PASS"
            echo
            echo "- PRE_CLEANUP_TESTS: remote public healthcheck 20/20 PASS at audited base"
            echo "- POST_CLEANUP_TESTS: formal + model campaign + current-Q validator PASS before commit"
            echo "- CLEANUP_STATUS: ${STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"
